<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>揭秘时间</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1220;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }

        .card {
            background: #181c2c;
            border: 1px solid #2a3045;
            border-radius: 28px;
            padding: 50px 40px 40px;
            width: 420px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        .title {
            color: #cdd6ff;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .time-box {
            background: #0b0e1a;
            border-radius: 20px;
            padding: 25px 20px;
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
            margin-bottom: 35px;
        }

        .time-box span {
            color: #8fa0ff;
        }

        button {
            width: 100%;
            padding: 17px 0;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2px;
            background: #353b52;
            color: #a0a5ba;
            cursor: not-allowed;
            transition: 0.25s ease;
        }

        button.active {
            background: #1f9d55;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(31,157,85,0.35);
        }

        button.active:hover {
            background: #26b362;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">⏰ 揭秘倒计时</div>
        <div class="time-box" id="timeBox">--:--:--</div>
        <button id="btn" disabled>🔒 暂未开放</button>
    </div>

    <script>
        const FILE = 'time.txt';
        const IMG = 'image.png';

        let targetTime = null;

        async function loadTargetTime() {
            try {
                const res = await fetch(FILE);
                const text = (await res.text()).trim();
                // 格式：202608141824 => 年月日时分
                if (text.length !== 12 || !/^\d{12}$/.test(text)) {
                    throw new Error('时间格式错误');
                }
                const y = +text.slice(0, 4);
                const mo = +text.slice(4, 6) - 1;
                const d = +text.slice(6, 8);
                const h = +text.slice(8, 10);
                const mi = +text.slice(10, 12);
                targetTime = new Date(y, mo, d, h, mi, 0).getTime();
            } catch (e) {
                document.getElementById('timeBox').textContent = '读取失败';
            }
        }

        function pad(n) { return n.toString().padStart(2, '0'); }

        function render() {
            if (!targetTime) return;
            const now = Date.now();
            const diff = Math.max(0, targetTime - now);
            const totalSec = Math.floor(diff / 1000);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            const box = document.getElementById('timeBox');
            const btn = document.getElementById('btn');

            if (diff > 0) {
                box.innerHTML = `${pad(h)}:${pad(m)}:${pad(s)}`;
                btn.disabled = true;
                btn.textContent = '🔒 暂未开放';
                btn.classList.remove('active');
            } else {
                box.innerHTML = `00:00:00`;
                btn.disabled = false;
                btn.textContent = '🎁 查看揭秘图片';
                btn.classList.add('active');
            }
        }

        async function init() {
            await loadTargetTime();
            render();
            setInterval(render, 1000);
        }

        document.getElementById('btn').addEventListener('click', function () {
            if (!this.disabled) {
                window.open(IMG, '_blank');
            }
        });

        init();
    </script>
</body>
</html>
