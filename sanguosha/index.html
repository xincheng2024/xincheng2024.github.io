/*================ 人类出牌阶段 ================*/
let PLAY=null,playTimer=null;
function humanPlayPhase(){
  return new Promise(res=>{
    PLAY={resolve:res,remain:15000};
    renderActionBar();
    startPlayTimer();
  });
}
function startPlayTimer(){
  stopPlayTimer();
  playTimer=setInterval(()=>{
    if(!PLAY)return;
    if(G.paused||G._dpause)return;
    PLAY.remain-=100;
    const bar=$("#timerBar");
    if(bar)bar.style.width=Math.max(0,PLAY.remain/150)+"%";
    if(PLAY.remain<=0){
      toast("出牌时间到，自动结束出牌阶段");
      endHumanPlay();
    }
  },100);
}
function stopPlayTimer(){if(playTimer){clearInterval(playTimer);playTimer=null;}const bar=$("#timerBar");if(bar)bar.style.width="0%";}
function endHumanPlay(){
  if(!PLAY)return;
  stopPlayTimer();centerClear();
  const r=PLAY.resolve;PLAY=null;renderActionBar();
  r();
}
function renderActionBar(){
  const bar=$("#actionBar");if(!bar)return;
  const me=humanP();
  if(G.drawResolve){
    bar.innerHTML=`<span class="hint">摸牌阶段，点击按钮摸牌（特效飞牌）</span>
      <button class="btn btn-primary" onclick="humanDrawClick()">摸 牌</button>`;
    return;
  }
  if(G.targetPick){
    const tp=G.targetPick;
    const name=tp.chosen!=null?pName(G.players[tp.chosen]):"未选择";
    bar.innerHTML=`<span class="hint">${tp.text||"请选择目标（点桌上的角色）"}｜已选：${name}</span>
      <button class="btn btn-sm btn-primary" ${tp.chosen==null?"disabled":""} onclick="confirmTargetPick()">确定目标</button>
      <button class="btn btn-sm btn-danger" onclick="cancelTargetPick()">取消选择</button>`;
    return;
  }
  if(G.humanDead||!me.alive){
    bar.innerHTML=`<span class="hint">你已阵亡，观战中……</span>`;
    return;
  }
  if(G.over){bar.innerHTML="";return;}
  if(PLAY){
    const gen=genOf(me);
    const btns=[];
    btns.push(`<button class="btn btn-sm" onclick="uiVoluntaryDiscard()">主动弃牌</button>`);
    if(me.eq.weapon||me.eq.armor||me.eq.up||me.eq.down)
      btns.push(`<button class="btn btn-sm" onclick="eqManage()">装备管理</button>`);
    if(hasSkill(me,"苦肉")&&me.hp>1)btns.push(`<button class="btn btn-sm" onclick="playSkill('kurou')">苦肉（-1血摸2）</button>`);
    if(hasSkill(me,"制衡")&&!me.used.zhiheng&&me.hand.length)btns.push(`<button class="btn btn-sm" onclick="playSkill('zhiheng')">制衡</button>`);
    if(hasSkill(me,"仁德")&&me.hand.length)btns.push(`<button class="btn btn-sm" onclick="playSkill('rende')">仁德</button>`);
    if(hasSkill(me,"青囊")&&!me.used.qingnang&&me.hand.length)btns.push(`<button class="btn btn-sm" onclick="playSkill('qingnang')">青囊</button>`);
    if(hasSkill(me,"结姻")&&!me.used.jieyin&&me.hand.length>=2)btns.push(`<button class="btn btn-sm" onclick="playSkill('jieyin')">结姻</button>`);
    if(hasSkill(me,"反间")&&!me.used.fanjian)btns.push(`<button class="btn btn-sm" onclick="playSkill('fanjian')">反间</button>`);
    if(hasSkill(me,"离间")&&!me.used.lijian&&me.hand.length)btns.push(`<button class="btn btn-sm" onclick="playSkill('lijian')">离间</button>`);
    bar.innerHTML=`<span class="hint">出牌阶段：点手牌使用（剩余 ${Math.ceil(PLAY.remain/1000)} 秒）${(me.used.shaCount||0)>0?`｜已出${me.used.shaCount}张杀`:""}</span>
      ${btns.join("")}
      <button class="btn btn-sm btn-danger" onclick="endHumanPlay()">结束出牌</button>`;
    return;
  }
  bar.innerHTML=`<span class="hint">${esc(G.cur!==null?`${pName(G.players[G.cur])}的回合`:"")}</span>`;
}
async function playSkill(k){
  if(!PLAY)return;
  const me=humanP();
  let done=false;
  if(k==="kurou")done=await skillKurou(me);
  if(k==="zhiheng")done=await skillZhiheng(me);
  if(k==="rende")done=await skillRende(me);
  if(k==="qingnang")done=await skillQingnang(me);
  if(k==="jieyin")done=await skillJieyin(me);
  if(k==="fanjian")done=await skillFanjian(me);
  if(k==="lijian")done=await skillLijian(me);
  if(done)renderActionBar();
}
async function uiVoluntaryDiscard(){
  const me=humanP();
  if(!PLAY||!me.hand.length)return;
  const picks=await chooseCardsModal({title:"主动弃牌",text:"选择要弃置的手牌",cards:me.hand,min:1,max:me.hand.length,ok:"弃 置"});
  if(!picks)return;
  for(const c of picks){loseHand(me,c);toDiscard(c);}
  log(`你主动弃掉了${picks.length}张牌：${picks.map(c=>"【"+c.name+"】").join("")}`);
  renderAll();
}
async function eqManage(){
  const me=humanP();
  const slots=[];
  if(me.eq.weapon)slots.push({key:"weapon",title:`卸下武器【${me.eq.weapon.name}】`,desc:"收回手牌"});
  if(me.eq.armor)slots.push({key:"armor",title:`卸下防具【${me.eq.armor.name}】`,desc:"收回手牌"});
  if(me.eq.up)slots.push({key:"up",title:`卸下+1马【${me.eq.up.name}】`,desc:"收回手牌"});
  if(me.eq.down)slots.push({key:"down",title:`卸下-1马【${me.eq.down.name}】`,desc:"收回手牌"});
  if(!slots.length)return;
  const k=await optionsModal("装备管理","选择要处理的装备：",[
    ...slots,
    ...slots.map(s=>({key:s.key+"_d",title:`弃置${s.title.slice(2)}`,desc:"直接进弃牌堆"}))
  ]);
  if(!k)return;
  const disc=k.endsWith("_d");
  const slot=disc?k.slice(0,-2):k;
  const c=removeEquip(me,slot,disc?null:me);
  if(c)log(`${pName(me)}${disc?"弃置":"卸下"}了【${c.name}】`);
  renderActionBar();
}
function trickOptionsFor(c){
  const me=humanP();
  const opts=[];
  if(c.sub==="weapon"||c.sub==="armor"||c.sub==="mountU"||c.sub==="mountD")
    opts.push({key:"equip",title:"装备此牌",desc:"替换旧装备（旧的进入弃牌堆）"});
  if(hasSkill(me,"国色")&&c.suit==="D")opts.push({key:"lebu",title:"【国色】当乐不思蜀使用"});
  if(hasSkill(me,"奇袭")&&(c.suit==="S"||c.suit==="C"))opts.push({key:"shun",title:"【奇袭】当顺手牵羊使用"});
  if(hasSkill(me,"武圣")&&SUIT_RED[c.suit])opts.push({key:"sha",title:"【武圣】当杀使用"});
  if(hasSkill(me,"龙胆")&&c.sub==="shan")opts.push({key:"sha",title:"【龙胆】当杀使用"});
  if(!opts.length)opts.push({key:"normal",title:"使用此牌"});
  return opts;
}
async function handCardClick(cid){
  if(!PLAY||G.over)return;
  const me=humanP();
  const card=me.hand.find(c=>c.id===cid);
  if(!card)return;
  let action="normal",viaCard=card;
  const opts=trickOptionsFor(card);
  if(opts.length>1||opts[0].key!=="normal"){
    const k=await optionsModal(`【${card.name}】${SUITS[card.suit]}${rankText(card.rank)}`,"选择使用方式：",opts);
    if(!k)return;
    action=k;
  }
  if(action==="equip"){equipCard(me,card);renderActionBar();return;}
  if(action==="lebu"||action==="shun"||action==="sha"){
    viaCard={...card,sub:action==="lebu"?"delay":action==="shun"?"trick":"sha",_as:opts.find(o=>o.key===action).title.match(/【(.+?)】/)[1]};
  }
  await dispatchHumanCard(viaCard,action==="normal"?card.sub:action==="lebu"?"delay":action==="shun"?"trick":"sha");
  renderActionBar();
}
async function dispatchHumanCard(card,sub){
  const me=humanP();
  if(sub==="sha"){
    if((me.used.shaCount||0)>0&&!hasSkill(me,"咆哮")&&!(me.eq.weapon&&me.eq.weapon.name==="诸葛连弩")){
      toast("本回合已使用过【杀】！");return;
    }
    const legal=legalShaTargets(me);
    if(!legal.length){toast("攻击范围内没有可攻击的目标！");return;}
    let tgts;
    const lastHand=me.hand.filter(c=>c.id!==card.id).length===0;
    if(me.eq.weapon&&me.eq.weapon.name==="方天画戟"&&lastHand){
      toast("方天画戟：选择至多3名目标");
      tgts=await pickMultiSeat(legal,3,"方天画戟：选择至多3名目标");
      if(!tgts)return;
    }else{
      toast("选择【杀】的目标");
      const t=await pickTarget(legal,"选择【杀】的目标（点桌上角色后点确定）");
      if(!t)return;
      tgts=[t];
    }
    if(card._as){loseHand(me,card);toDiscard(card);await castSha(me,tgts,null,{name:"杀",base:null,suit:card.suit});}
    else await castSha(me,tgts,card);
    renderActionBar();return;
  }
  if(sub==="shan"){toast("【闪】只能在被杀指定时打出");return;}
  if(sub==="tao"){
    if(me.hp>=me.maxHp){toast("体力已满！");return;}
    loseHand(me,card);toDiscard(card);
    me.hp=Math.min(me.maxHp,me.hp+1);
    log(`你使用【桃】，回复1点体力`,"good");
    fxText($("#seat0"),"+1","fx-heal");
    renderAll();return;
  }
  if(sub==="jiu"){
    if(me.used.jiuUsed){toast("本回合已用过【酒】");return;}
    loseHand(me,card);toDiscard(card);
    me.f.jiuSha=true;me.used.jiuUsed=true;
    log(`你使用【酒】，下一张【杀】伤害+1`,"good");
    renderAll();return;
  }
  if(sub==="trick"||sub==="delay"){
    const name=card.name;
    if(name==="无中生有"){loseHand(me,card);toDiscard(card);await trickWuzhong(me,card);return;}
    if(name==="决斗"){
      const legal=trickTargetsLegal(me,"决斗");
      toast("决斗：选择目标");
      const t=await pickTarget(legal,"决斗：选择目标");
      if(!t)return;
      loseHand(me,card);toDiscard(card);await trickJuedou(me,t,card);return;
    }
    if(name==="借刀杀人"){await trickJiedao(me,card);return;}
    if(name==="顺手牵羊"){loseHand(me,card);toDiscard(card);await trickShun(me,card);return;}
    if(name==="过河拆桥"){loseHand(me,card);toDiscard(card);await trickChai(me,card);return;}
    if(name==="乐不思蜀"){loseHand(me,card);toDiscard(card);await trickLebu(me,card);return;}
    if(name==="闪电"){loseHand(me,card);toDiscard(card);await trickShandian(me,card);return;}
    if(name==="南蛮入侵"){loseHand(me,card);toDiscard(card);await trickNanman(me,card);return;}
    if(name==="万箭齐发"){loseHand(me,card);toDiscard(card);await trickWanjian(me,card);return;}
    if(name==="桃园结义"){loseHand(me,card);toDiscard(card);await trickTaoyuan(me,card);return;}
    if(name==="五谷丰登"){loseHand(me,card);toDiscard(card);await trickWugu(me,card);return;}
  }
  if(sub==="weapon"||sub==="armor"||sub==="mountU"||sub==="mountD"){equipCard(me,card);renderActionBar();return;}
  toast("无法使用此牌");
}
/*================ AI 出牌阶段 ================*/
async function aiPlayPhase(p){
  let guard=0;
  while(!G.over&&p.alive&&guard++<40){
    await think(p);
    const act=aiChoosePlay(p);
    if(!act)break;
    await aiDoAction(p,act);
    await wait(450);
  }
  await wait(300);
}
function aiChoosePlay(p){
  const hand=p.hand;
  const find=n=>hand.find(c=>c.name===n);
  const lv=CFG.aiLevel;
  /* 回血 */
  if(p.hp<Math.min(p.maxHp,3)){
    const tao=find("桃");
    if(tao)return {k:"tao",c:tao};
  }
  /* 酒+杀斩杀 */
  const enemyInRange=aiChooseTarget(p,legalShaTargets(p));
  if(enemyInRange&&enemyInRange.hp===1&&find("酒")&&(find("杀")||hasSkill(p,"武圣")))
    return {k:"jiu",c:find("酒")};
  /* 装备 */
  for(const c of hand){
    if(c.sub==="weapon"&&(!p.eq.weapon||p.eq.weapon.range<c.range))return {k:"equip",c};
    if(c.sub==="armor"&&!p.eq.armor)return {k:"equip",c};
    if(c.sub==="mountU"&&!p.eq.up)return {k:"equip",c};
    if(c.sub==="mountD"&&!p.eq.down)return {k:"equip",c};
  }
  /* 摸牌锦囊 */
  if(find("无中生有"))return {k:"trick",name:"无中生有"};
  if(find("五谷丰登"))return {k:"trick",name:"五谷丰登"};
  if(find("桃园结义")&&(aiFriends(p).some(f=>f.hp<f.maxHp)||p.hp<p.maxHp))return {k:"trick",name:"桃园结义"};
  /* 乐不思蜀 */
  const lebu=find("乐不思蜀")||(hasSkill(p,"国色")?hand.find(c=>c.suit==="D"):null);
  if(lebu){
    const legal=trickTargetsLegal(p,"乐不思蜀");
    const tgt=aiChooseTarget(p,legal);
    if(tgt)return {k:"lebu",c:lebu,tgt};
  }
  /* 顺手/过河 */
  const shun=find("顺手牵羊")||(hasSkill(p,"奇袭")?hand.find(c=>c.suit==="S"||c.suit==="C"):null);
  if(shun){
    const legal=trickTargetsLegal(p,"顺手牵羊");
    const tgt=aiChooseTarget(p,legal.filter(x=>aiRel(p,x)!=="friend"));
    if(tgt)return {k:"shun",c:shun,tgt};
  }
  const chai=find("过河拆桥");
  if(chai){
    const legal=trickTargetsLegal(p,"过河拆桥");
    const tgt=aiChooseTarget(p,legal.filter(x=>aiRel(p,x)!=="friend"));
    if(tgt)return {k:"chai",c:chai,tgt};
  }
  /* 决斗 */
  const jd=find("决斗");
  if(jd){
    const legal=trickTargetsLegal(p,"决斗");
    const tgt=aiChooseTarget(p,legal.filter(x=>aiRel(p,x)==="enemy"&&(x.hp<=2||x.hand.length<2)));
    if(tgt)return {k:"juedou",c:jd,tgt};
  }
  /* 主动技能 */
  if(hasSkill(p,"制衡")&&!p.used.zhiheng&&hand.length&&hand.every(c=>c.sub==="sha"||c.sub==="shan"||cardVal(c,p)<40)&&hand.length>=2)
    return {k:"skillZhiheng"};
  if(hasSkill(p,"苦肉")&&p.hp>=3&&hand.length<=1)return {k:"skillKurou"};
  if(hasSkill(p,"仁德")&&hand.length>=4&&aiFriends(p).length)return {k:"skillRende"};
  if(hasSkill(p,"青囊")&&!p.used.qingnang&&hand.length){
    const hurt=aiFriends(p).filter(f=>f.hp<f.maxHp);
    if(hurt.length||p.hp<p.maxHp-1)return {k:"skillQingnang"};
  }
  if(hasSkill(p,"结姻")&&!p.used.jieyin&&hand.length>=2){
    const males=G.players.filter(x=>x.alive&&genOf(x).gender==="男"&&x.hp<x.maxHp&&(x===p||aiRel(p,x)!=="enemy"));
    if(males.length)return {k:"skillJieyin"};
  }
  if(hasSkill(p,"反间")&&!p.used.fanjian&&hand.length&&aiEnemies(p).length)return {k:"skillFanjian"};
  if(hasSkill(p,"离间")&&!p.used.lijian&&hand.length){
    const males=others(p).filter(x=>genOf(x).gender==="男");
    if(males.length>=2&&males.filter(x=>aiRel(p,x)==="enemy").length>=2)return {k:"skillLijian"};
  }
  /* 杀 */
  if(enemyInRange){
    const shaOpts=effectiveCards(p,"sha");
    const sha=shaOpts.find(c=>c.sub==="sha")||shaOpts.find(c=>c._as==="武圣"||c._as==="龙胆");
    const canSha=(p.used.shaCount||0)===0||hasSkill(p,"咆哮")||(p.eq.weapon&&p.eq.weapon.name==="诸葛连弩");
    if(sha&&canSha)return {k:"sha",c:sha,tgt:enemyInRange};
  }
  /* AOE */
  const enemies=aiEnemies(p).length,friends=aiFriends(p).length;
  if(enemies>friends&&enemies>=2){
    const nm=find("南蛮入侵");
    if(nm)return {k:"trick",name:"南蛮入侵"};
    const wj=find("万箭齐发");
    if(wj)return {k:"trick",name:"万箭齐发"};
  }
  if(find("闪电")&&hand.length>4)return {k:"trick",name:"闪电"};
  const jdao=find("借刀杀人");
  if(jdao&&lv>=2){
    const holder=others(p).find(t=>t.eq.weapon&&aiRel(p,t)!=="friend"&&others(t).some(x=>inShaRange(t,x)));
    if(holder)return {k:"jiedao",c:jdao};
  }
  return null;
}
async function aiDoAction(p,act){
  switch(act.k){
    case "tao":{
      const c=act.c;
      loseHand(p,c);toDiscard(c);
      p.hp=Math.min(p.maxHp,p.hp+1);
      log(`${pName(p)}使用【桃】，回复1点体力`,"good");
      fxText($("#seat"+p.seat),"+1","fx-heal");
      renderAll();break;
    }
    case "jiu":{
      loseHand(p,act.c);toDiscard(act.c);
      p.f.jiuSha=true;
      log(`${pName(p)}使用【酒】，下一张【杀】伤害+1`);
      renderAll();break;
    }
    case "equip":equipCard(p,act.c);break;
    case "trick":{
      const c=p.hand.find(x=>x.name===act.name);
      if(!c)break;
      loseHand(p,c);toDiscard(c);
      if(act.name==="无中生有")await trickWuzhong(p,c);
      else if(act.name==="五谷丰登")await trickWugu(p,c);
      else if(act.name==="桃园结义")await trickTaoyuan(p,c);
      else if(act.name==="南蛮入侵")await trickNanman(p,c);
      else if(act.name==="万箭齐发")await trickWanjian(p,c);
      else if(act.name==="闪电")await trickShandian(p,c);
      break;
    }
    case "lebu":{
      const c=p.hand.find(x=>x.id===act.c.id);
      if(!c)break;
      await aiLebu(p,c,act.tgt);
      break;
    }
    case "shun":{
      const c=act.c;
      if(!p.hand.find(x=>x.id===c.id))break;
      loseHand(p,c);toDiscard(c);
      await trickShun(p,c);break;
    }
    case "chai":{
      loseHand(p,act.c);toDiscard(act.c);
      await trickChai(p,act.c);break;
    }
    case "juedou":{
      loseHand(p,act.c);toDiscard(act.c);
      await trickJuedou(p,act.tgt,act.c);break;
    }
    case "sha":{
      if(act.c._as){
        const base=p.hand.find(x=>x.id===act.c._base);
        if(base){loseHand(p,base);toDiscard(base);}
        await castSha(p,[act.tgt],null,{name:"杀",base:null,suit:act.c.suit});
      }else await castSha(p,[act.tgt],act.c);
      break;
    }
    case "jiedao":await trickJiedao(p,act.c);break;
    case "skillZhiheng":await skillZhiheng(p);break;
    case "skillKurou":await skillKurou(p);break;
    case "skillRende":await skillRende(p);break;
    case "skillQingnang":await skillQingnang(p);break;
    case "skillJieyin":await skillJieyin(p);break;
    case "skillFanjian":await skillFanjian(p);break;
    case "skillLijian":await skillLijian(p);break;
  }
  renderAll();
}
/* 修正：AI 乐不思蜀直接指定目标 */
async function aiLebu(p,c,tgt){
  loseHand(p,c);toDiscard(c);
  centerAdd(c,p);
  if(hasSkill(p,"集智"))await drawCards(p,1,{silent:true});
  await wait(300);
  if(await askWuxie("乐不思蜀",[tgt],p)){centerClear();return;}
  tgt.judge.push(c);
  log(`${pName(p)}对${pName(tgt)}使用了【乐不思蜀】`);
  if(tgt.seat===HUMAN)toast("你被乐不思蜀了！下回合判定非红桃将跳过出牌阶段");
  renderAll();await wait(400);
  centerClear();
}
