<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>三国杀 · 超级仿真</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#e8c47a;--gold2:#8a6a35;--bg1:#1c130a;--bg2:#0d0803;--red:#ff5a4c;--green:#4cd964}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% 30%,#2a1c0e,var(--bg2));color:#f3e6c8;font-family:"Microsoft YaHei","PingFang SC",sans-serif;overflow:hidden;touch-action:manipulation}
body.light{background:radial-gradient(1200px 700px at 50% 30%,#f0e6d0,#ddd0b4);color:#3a2e18}
body.light .btn{background:linear-gradient(180deg,#e8d9b8,#cfbc94);border-color:#a88a52;color:#3a2e18}
body.light .btn-primary{background:linear-gradient(180deg,#d4a85a,#b8843a);border-color:#8a6228;color:#2a1a08}
body.light input,body.light select{background:#fdf6e6;border-color:#a88a52;color:#3a2e18}
body.light .tile{background:linear-gradient(160deg,#f5ecd4,#e6d6ac);border-color:#a88a52;color:#3a2e18}
body.light .check{background:#fdf6e6;border-color:#a88a52}
body.light .check.on{background:var(--gold);box-shadow:inset 0 0 0 3px #fdf6e6}
body.light .card{background:linear-gradient(160deg,#fffaf0,#f0e4c8);border-color:#b89a5e;color:#3a2e18}
body.light .seat-q,body.light #hand .qmark{background:#fffaf0;color:#3a2e18;border-color:#b89a5e}
body.light .cfg-left,body.light .cfg-right{background:rgba(255,255,255,.6);border-color:rgba(138,106,53,.5)}
body.light .seg button,body.light .cat-tabs button,body.light .assist-lv button{background:#e8d9b8;color:#3a2e18;border-color:#a88a52}
body.light .seat{background:rgba(255,250,240,.75);border-color:#b89a5e;color:#3a2e18}
body.light .modal{background:linear-gradient(180deg,#f5ecd4,#e6d6ac);border-color:#a88a52;color:#3a2e18}
body.light .modal h3{color:#8a5a1d}
body.light .mbody{color:#4a3a20}
body.light .center-zone{background:rgba(255,255,255,.5);border-color:rgba(138,106,53,.5)}
body.light .deck-zone,body.light .judge-stand{background:rgba(255,255,255,.4)}
body.light .jtag{color:#6a5428}
body.light .hp-dot.lost{background:#d8c8a8;border-color:#b8a078}
body.light .eq-chip{background:#fdf6e6;border-color:#a88a52;color:#7a5a1d}
body.light .log-strip{background:rgba(255,255,255,.7);border-color:rgba(138,106,53,.5)}
body.light .log-strip .lg{color:#4a3a20}
body.light .big-toast{background:rgba(255,248,230,.96);border-color:#8a6228;color:#3a2e18}
body.light .cd-mask{background:rgba(240,230,210,.5)}
body.light .tab-btn{background:#e8d9b8;color:#5a4628;border-color:#a88a52}
body.light .tab-btn.on{background:#b8843a;color:#2a1a08;border-color:#8a6228}
body.light .cat-tag{color:#6a5428}
body.light #homeLock{background:#f5ecd4;border-color:#a88a52}
body.light .cd-t,body.light .cd-n{color:#3a2e18}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.btn{background:linear-gradient(180deg,#4a3016,#2b1a0a);border:1.5px solid var(--gold2);color:#f3e6c8;border-radius:8px;padding:9px 16px;font-size:15px;letter-spacing:2px;transition:.15s;min-height:38px}
.btn:hover{border-color:var(--gold);box-shadow:0 0 10px rgba(232,196,122,.35)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,#8a4b1d,#5c2f0e);border-color:#c98f3f}
.btn-danger{background:linear-gradient(180deg,#7a2b1d,#4a1810);border-color:#a8452f}
.btn-sm{padding:5px 10px;font-size:13px;min-height:30px;letter-spacing:1px}
input,select{font-family:inherit;background:#1a1208;border:1px solid var(--gold2);color:#f3e6c8;border-radius:5px;padding:7px 10px;font-size:14px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.hidden{display:none!important}
/* ===== 主页 ===== */
#home{justify-content:flex-start;overflow-y:auto;padding:clamp(14px,3vh,36px)}
#home h1{font-size:clamp(30px,7vh,58px);letter-spacing:clamp(6px,1.5vh,14px);color:var(--gold);text-shadow:0 0 24px rgba(232,196,122,.5),0 2px 4px #000;margin:clamp(8px,3vh,40px) auto clamp(10px,2vh,20px);font-weight:900;text-align:center}
.home-sub{text-align:center;color:#b89a68;font-size:clamp(11px,1.8vh,14px);letter-spacing:4px;margin-bottom:auto}
.home-btns{display:flex;flex-direction:column;gap:clamp(10px,2.2vh,20px);width:min(340px,86vw);margin:auto 0}
.home-btns .btn{padding:clamp(10px,2.2vh,16px);font-size:clamp(16px,2.8vh,21px);letter-spacing:4px}
#codexBtn{position:absolute;left:14px;bottom:14px}
#homeLock{position:absolute;right:14px;top:14px;font-size:20px;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold2);background:#2b1a0a}
/* ===== 配置页 ===== */
.cfg-head{width:100%;max-width:1060px;display:flex;align-items:center;gap:10px;padding:10px 12px 0;flex-wrap:wrap}
.cfg-head h2{font-size:clamp(18px,3vh,24px);color:var(--gold);letter-spacing:3px;flex:1}
.tab-btns{display:flex;gap:6px;flex-wrap:wrap}
.tab-btn{padding:6px 14px;border:1px solid var(--gold2);border-radius:14px;font-size:13px;color:#cbb387}
.tab-btn.on{background:#5c3a17;color:#ffe9a8;border-color:var(--gold)}
.cfg-wrap{width:100%;max-width:1060px;flex:1;display:grid;grid-template-columns:280px 1fr;gap:12px;padding:10px 12px 64px;min-height:0}
.cfg-left{background:rgba(0,0,0,.35);border:1px solid rgba(138,106,53,.5);border-radius:10px;padding:12px;overflow-y:auto}
.cfg-right{display:flex;flex-direction:column;min-height:0;background:rgba(0,0,0,.25);border:1px solid rgba(138,106,53,.4);border-radius:10px;padding:10px;overflow:hidden}
.cfg-foot{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:14px;padding:10px;background:linear-gradient(0deg,rgba(13,8,3,.95),transparent)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#cbb387;margin-bottom:6px;letter-spacing:1px}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{padding:6px 12px;border:1px solid var(--gold2);border-radius:6px;font-size:13px;background:#241505}
.seg button.on{background:#8a4b1d;color:#ffe9a8;border-color:var(--gold)}
.note{font-size:12px;color:#9a8158;line-height:1.7}
.cfg-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.cfg-tools input[type=text]{flex:1;min-width:130px}
.cfg-tools select{max-width:150px}
.assist-lv{display:flex;gap:4px}
.assist-lv button{padding:5px 9px;border:1px solid var(--gold2);border-radius:12px;font-size:12px;background:#241505;color:#cbb387}
.cat-tabs{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.cat-tabs button{padding:4px 11px;border:1px solid var(--gold2);border-radius:12px;font-size:12px;color:#cbb387}
.cat-tabs button.on{background:#5c3a17;color:#ffe9a8}
.grid-list{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start;padding:2px}
.tile{background:linear-gradient(160deg,#33220f,#1d1206);border:1.5px solid var(--gold2);border-radius:10px;padding:8px;position:relative;text-align:center;min-height:104px}
.tile.off{opacity:.35;filter:grayscale(.6)}
.tile .diff{font-size:11px;color:#9a8158;margin-top:3px}
.check{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--gold2);background:#1a1208;cursor:pointer}
.check.on{background:var(--gold);box-shadow:inset 0 0 0 3px #1a1208}
.check.lock{opacity:.5;cursor:not-allowed;background:#5c2f0e}
.q{position:absolute;right:5px;top:5px;width:20px;height:20px;border-radius:50%;background:#3a2a12;border:1px solid var(--gold2);color:#ffe9a8;font-size:13px;line-height:18px;z-index:2}
.gname{font-size:17px;letter-spacing:2px;font-weight:bold;margin-top:4px}
.gmeta{font-size:11px;color:#9a8158;margin:3px 0}
.gskills{font-size:12px;color:#ffd24c;line-height:1.5}
.kingdom-wei{color:#7fa8ff}.kingdom-shu{color:#ff8a6a}.kingdom-wu{color:#6ad9a0}.kingdom-qun{color:#c9b3a0}
.plan-box{border:1.5px solid var(--gold2);border-radius:8px;padding:9px;margin-top:8px;cursor:pointer;font-size:13px;line-height:1.8}
.plan-box.sel{border-color:var(--gold);background:#3a2410;box-shadow:0 0 10px rgba(232,196,122,.3)}
.plan-id{display:inline-block;padding:0 7px;border-radius:9px;border:1px solid;font-size:12px;margin-right:4px}
.id-lord{background:#c9a227;color:#1a1208;border-color:#ffe9a8}
.id-zhong{background:#2e86c1;color:#fff;border-color:#85c1e9}
.id-zei{background:#c0392b;color:#fff;border-color:#e8927c}
.id-nei{background:#7d3c98;color:#fff;border-color:#c39bd3}
.id-hidden{background:#444;color:#bbb;border-color:#666}
.cheat-extra{border:1px dashed #2ecc71;border-radius:8px;padding:10px;margin-top:8px;display:none}
.cheat-extra.on{display:block}
/* ===== 卡牌 ===== */
.card{width:70px;height:100px;border-radius:7px;position:relative;flex-shrink:0;
  background:linear-gradient(160deg,#f7ecd2,#e4d0a8);color:#1a1208;border:1px solid #a89058;
  display:flex;flex-direction:column;box-shadow:0 2px 5px rgba(0,0,0,.5);transition:transform .12s}
.card .corner{display:flex;justify-content:space-between;padding:3px 4px;font-size:13px;font-weight:bold;line-height:1}
.card .cname{margin:auto;text-align:center;font-size:13px;font-weight:bold;letter-spacing:1px;padding:0 2px;white-space:nowrap;overflow:hidden}
.card .cat-tag{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;color:#6a5428}
.card.suit2{background:linear-gradient(160deg,#fbdcdc,#f0c0b8)}
.card.back{background:linear-gradient(160deg,#3a5c8a,#1c3050);border-color:#2a4a70}
.card.back::after{content:"杀";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(232,196,122,.8);font-size:22px;font-weight:900;letter-spacing:2px}
.card.cmini{width:46px;height:66px}.card.cmini .cname{font-size:10px}.card.cmini .corner{font-size:10px}
.card.type-trick{box-shadow:0 0 0 1.5px #9a6ad9 inset,0 2px 5px rgba(0,0,0,.5)}
.card.type-equip{box-shadow:0 0 0 1.5px #6a9ad9 inset,0 2px 5px rgba(0,0,0,.5)}
.card .qmark{position:absolute;right:2px;top:2px;width:17px;height:17px;border-radius:50%;background:rgba(26,18,8,.75);color:#ffe9a8;font-size:11px;line-height:16px;z-index:3;border:1px solid #c9a86a}
#handCards .card{cursor:pointer}
#handCards .card:hover{transform:translateY(-8px)}
#handCards .card.disabled{opacity:.45;filter:grayscale(.5)}
/* ===== 游戏 ===== */
#game{justify-content:flex-start}
.g-top{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:30;background:linear-gradient(0deg,transparent,rgba(13,8,3,.9))}
.phase{font-size:clamp(12px,2vh,16px);color:#ffe9a8;letter-spacing:1px;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer-bar-wrap{width:100%;height:4px;background:rgba(0,0,0,.5)}
#timerBar{height:100%;width:0%;background:linear-gradient(90deg,#4cd964,#ffd24c 60%,#ff5a4c);border-radius:4px}
.g-table{position:absolute;left:0;right:0;top:44px;bottom:calc(56px + 168px);z-index:5}
.center-zone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(64%,760px);height:66%;border:2px solid rgba(232,196,122,.4);border-radius:14px;background:rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;padding:6px;z-index:1}
.zone-label{font-size:11px;color:rgba(232,196,122,.75);letter-spacing:3px;align-self:flex-start}
.play-area{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:6px;width:100%;overflow-y:auto;padding:4px}
.played-card{position:relative}
.played-card .by{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:10px;color:#ffe9a8;white-space:nowrap;text-shadow:0 1px 2px #000;z-index:2}
.judge-stand{position:absolute;left:8px;top:6px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;max-width:24%;z-index:2}
.judge-stand .jcard{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.judge-stand .jtag{font-size:10px;color:#cbb387}
.deck-zone{position:absolute;right:8px;top:6px;display:flex;gap:8px;align-items:flex-start;z-index:2}
.deck-pile{position:relative;text-align:center}
.deck-pile .cnt{position:absolute;left:50%;top:33px;transform:translateX(-50%);color:#ffe9a8;font-size:13px;text-shadow:0 1px 2px #000;font-weight:bold}
.deck-pile .lbl{font-size:10px;color:#cbb387;margin-top:26px}
.seat{position:absolute;transform:translate(-50%,-50%);z-index:10}
.seat-box{background:linear-gradient(180deg,rgba(40,26,12,.95),rgba(20,12,5,.95));border:2px solid var(--gold2);border-radius:10px;padding:5px 7px;position:relative;min-width:118px;max-width:150px}
.seat.active .seat-box{border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,76,.65)}
.seat-num{position:absolute;left:-9px;top:-9px;width:24px;height:24px;border-radius:50%;background:#7a4f1e;border:2px solid var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;z-index:3}
.seat.targetable{cursor:pointer}
.seat.targetable .seat-box{border-color:var(--green);animation:pulseLegal 1s infinite}
.seat.picked .seat-box{border-color:var(--gold);box-shadow:0 0 20px rgba(255,210,76,.9);animation:none}
@keyframes pulseLegal{0%,100%{box-shadow:0 0 4px rgba(76,217,100,.5)}50%{box-shadow:0 0 16px rgba(76,217,100,.95)}}
.s-row1{display:flex;align-items:center;gap:5px}
.s-name{font-size:15px;letter-spacing:1px;flex:1;white-space:nowrap}
.s-id{font-size:11px;padding:0 6px;border-radius:9px;border:1px solid;flex-shrink:0}
.seat-q{position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:50%;background:#3a2a12;border:1px solid var(--gold2);color:#ffe9a8;font-size:12px;line-height:16px;z-index:4}
.s-hp{display:flex;gap:2px;margin:4px 0 2px;flex-wrap:wrap}
.hp-dot{width:11px;height:11px;border-radius:50%;background:var(--red);border:1px solid #ff9a8a}
.hp-dot.lost{background:#3a2a20;border-color:#5a4430}
.eq-chip{display:inline-block;font-size:10px;background:#2b1d10;border:1px solid var(--gold2);border-radius:8px;padding:0 5px;margin:1px 2px 0 0;color:#e8c47a;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-eqs{display:flex;flex-wrap:wrap;max-width:100%}
.think-txt{font-size:10px;color:#6ad9ff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
/* 日志条 */
.log-strip{position:absolute;left:10px;right:10px;bottom:6px;height:52px;overflow-y:auto;background:rgba(0,0,0,.45);border:1px solid rgba(138,106,53,.4);border-radius:8px;padding:3px 8px;font-size:11px;line-height:1.55;z-index:6;cursor:pointer}
.log-strip .lg{color:#cbb387;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg.hit{color:#ff9a8a}.lg.good{color:#7fe0a0}.lg.sys{color:#8ab8e8}.lg.gold{color:#ffd24c}
.log-full{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:80;padding:14px;overflow-y:auto}
.log-full .lg{font-size:13px;line-height:1.9}
/* 手牌区 */
.hand-zone{position:absolute;left:0;right:0;bottom:0;height:168px;z-index:20;background:linear-gradient(0deg,rgba(13,8,3,.97),rgba(13,8,3,.75));border-top:1px solid rgba(138,106,53,.5)}
.action-bar{display:flex;gap:6px;align-items:center;padding:5px 10px;flex-wrap:wrap;min-height:40px}
.action-bar .hint{font-size:12px;color:#cbb387;flex:1;min-width:0}
.hand-cards{display:flex;gap:5px;padding:2px 10px 8px;overflow-x:auto;align-items:flex-end;min-height:104px}
#cheatBtn{position:absolute;right:18px;bottom:186px;width:34px;height:34px;border-radius:50%;background:#2ecc71;border:2px solid #a8f0c0;z-index:40;box-shadow:0 0 10px rgba(46,204,113,.7);display:none}
#cheatBtn.on{background:#27ae60;box-shadow:0 0 18px #2ecc71}
/* ===== 弹窗 ===== */
#modalRoot .modal-mask,#detailRoot .modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px}
#detailRoot .modal-mask{z-index:70;background:rgba(0,0,0,.6)}
.modal{background:linear-gradient(180deg,#2b1d10,#1a1206);border:2px solid var(--gold2);border-radius:14px;padding:16px;max-width:min(680px,94vw);max-height:88vh;overflow-y:auto;min-width:min(320px,90vw)}
.modal h3{color:var(--gold);font-size:19px;letter-spacing:2px;margin-bottom:8px;text-align:center}
.mbody{font-size:14px;line-height:1.7;color:#e8d9b8}
.mfoot{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pick-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0;max-height:52vh;overflow-y:auto}
.pick-grid .card{cursor:pointer}
.pick-grid .card.sel{outline:3px solid var(--gold);transform:translateY(-6px)}
.pick-grid .card.illegal{opacity:.35;filter:grayscale(.7);cursor:not-allowed}
.opt-list{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.opt{border:1.5px solid var(--gold2);border-radius:8px;padding:9px 13px;background:#2b1d10;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--gold)}
.opt.disabled{opacity:.4;cursor:not-allowed}
.opt.sel{border-color:var(--gold);background:#5a3c22;box-shadow:0 0 10px rgba(255,210,76,.4)}
.ot{font-size:14px}.od{font-size:12px;color:#9a8158;margin-top:2px}
.big-toast{position:fixed;top:16%;left:50%;transform:translateX(-50%);background:rgba(20,12,5,.95);border:1.5px solid var(--gold);color:#ffe9a8;padding:9px 20px;border-radius:22px;font-size:14px;z-index:99;max-width:90vw;text-align:center;animation:toastIn .25s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}}
/* 详情浮层 */
.gdetail-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.big-name{font-size:34px;font-weight:900;letter-spacing:4px;text-shadow:0 0 14px currentColor}
.sub{font-size:12px;color:#9a8158}
.bg-box{background:rgba(0,0,0,.3);border-radius:8px;padding:9px 12px;font-size:13px;color:#cbb387;line-height:1.8;margin-bottom:10px}
.skill-box{border:1px solid rgba(138,106,53,.5);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:rgba(0,0,0,.25)}
.sn{color:#ffd24c;font-weight:bold;font-size:15px;letter-spacing:1px;margin-right:6px}
.sk-tag{font-size:11px;color:#8ab8e8;border:1px solid #3a6a8a;border-radius:8px;padding:0 6px}
.sd{font-size:13px;color:#d8c9a8;line-height:1.8;margin-top:4px}
.skill-ref{color:#6ab8ff;cursor:pointer;text-decoration:underline}
/* 图鉴 */
.codex-head{width:100%;max-width:1060px;display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap}
.codex-body{width:100%;max-width:1060px;flex:1;overflow-y:auto;padding:0 12px 20px;min-height:0}
.flying{position:fixed;z-index:95;transition:all .6s ease;pointer-events:none}
.fx-burst{position:fixed;width:14px;height:14px;border-radius:50%;pointer-events:none;z-index:94}
.fx-text{position:fixed;font-size:22px;font-weight:900;z-index:96;pointer-events:none;text-shadow:0 1px 3px #000;transition:all .8s ease}
.fx-heal{color:#5be08a!important}
.cd-mask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;background:rgba(0,0,0,.35)}
.cd-t{font-size:clamp(16px,3vh,24px);color:#ffe9a8;letter-spacing:2px;margin-bottom:8px}
.cd-n{font-size:clamp(40px,9vh,72px);color:var(--gold);font-weight:900;text-shadow:0 0 30px rgba(232,196,122,.6)}

<body>
<!-- ============ 主页 ============ -->
<section id="home" class="screen">
  <button id="homeLock" title="作弊模式" onclick="openCheatPwd()">🔒</button>
  <h1>三 国 杀</h1>
  <div class="home-sub">超 级 仿 真 版</div>
  <div class="home-btns">
    <button class="btn" onclick="openCfg('role')">配置角色，武将，卡牌</button>
    <button class="btn" onclick="openCfg('game')">配置游戏</button>
    <button class="btn btn-primary" onclick="startGame()">开 始 游 戏</button>
  </div>
  <button class="btn btn-sm" id="codexBtn" onclick="openCodex()">📖 图鉴</button>
</section>

<!-- ============ 配置角色/武将/卡牌 ============ -->
<section id="cfgRole" class="screen hidden">
  <div class="cfg-head">
    <button class="btn btn-sm" onclick="cancelRoleCfg()">← 返回</button>
    <h2>配置角色，武将，卡牌</h2>
    <div class="tab-btns">
      <button class="tab-btn" data-tab="role" onclick="switchRoleTab('role')">角色身份</button>
      <button class="tab-btn" data-tab="general" onclick="switchRoleTab('general')">武将池</button>
      <button class="tab-btn" data-tab="card" onclick="switchRoleTab('card')">卡牌池</button>
    </div>
  </div>
  <div class="cfg-wrap">
    <div class="cfg-left" id="roleLeft"></div>
    <div class="cfg-right" id="roleRight"></div>
  </div>
  <div class="cfg-foot">
    <button class="btn" onclick="cancelRoleCfg()">取 消</button>
    <button class="btn btn-primary" onclick="confirmRoleCfg()">确 认</button>
  </div>
</section>

<!-- ============ 配置游戏 ============ -->
<section id="cfgGame" class="screen hidden">
  <div class="cfg-head">
    <button class="btn btn-sm" onclick="goHome()">← 返回</button>
    <h2>配置游戏</h2>
  </div>
  <div class="cfg-wrap" style="grid-template-columns:1fr 1fr">
    <div class="cfg-left" id="gameCfgLeft"></div>
    <div class="cfg-left" id="planArea" style="max-height:none"></div>
  </div>
  <div class="cfg-foot">
    <button class="btn" onclick="goHome()">取 消</button>
    <button class="btn btn-primary" onclick="confirmGameCfg()">确 认</button>
  </div>
</section>

<!-- ============ 图鉴 ============ -->
<section id="codex" class="screen hidden">
  <div class="codex-head">
    <button class="btn btn-sm" onclick="goHome()">← 返回</button>
    <div class="tab-btns">
      <button class="tab-btn" data-tab="g" onclick="switchCodex('g')">武将</button>
      <button class="tab-btn" data-tab="c" onclick="switchCodex('c')">卡牌</button>
    </div>
    <input type="text" id="codexSearch" placeholder="搜索名称（子串匹配）" style="width:200px" oninput="renderCodex()">
  </div>
  <div class="codex-body" id="codexBody"></div>
</section>

<!-- ============ 游戏 ============ -->
<section id="game" class="screen hidden">
  <div class="g-top">
    <button class="btn btn-sm btn-danger" onclick="tryExitGame()">退出</button>
    <button class="btn btn-sm" id="pauseBtn" onclick="togglePause()">暂停</button>
    <button class="btn btn-sm" onclick="openLogFull()">📜</button>
    <div class="phase" id="phaseText">准备中…</div>
  </div>
  <div class="timer-bar-wrap"><div id="timerBar"></div></div>
  <div class="g-table" id="gTable">
    <div class="center-zone">
      <div class="zone-label">出 牌 区</div>
      <div class="play-area" id="playArea"></div>
    </div>
    <div class="judge-stand" id="judgeStand"><div class="zone-label">判 定 区</div></div>
    <div class="deck-zone">
      <div class="deck-pile" id="deckPile"><div class="card back cmini"></div><div class="cnt" id="deckCnt">0</div><div class="lbl">牌堆</div></div>
      <div class="deck-pile" id="discardPile"><div class="card cmini" id="discardTop" style="background:#333"></div><div class="cnt" id="discardCnt">0</div><div class="lbl">弃牌堆</div></div>
    </div>
    <div class="log-strip" id="logStrip" onclick="openLogFull()"></div>
  </div>
  <div class="hand-zone">
    <div class="action-bar" id="actionBar"></div>
    <div class="hand-cards" id="handCards"></div>
  </div>
  <button id="cheatBtn" title="透视开关" onclick="toggleXray()"></button>
</section>

<div id="modalRoot"></div>
<div id="detailRoot"></div>

  let remain=ms,last=performance.now();
  const tick=()=>{const now=performance.now(),d=now-last;last=now;
    if(G&&(G.paused||G._dpause)){setTimeout(tick,100);return;}
    remain-=d;
    if(remain<=0)res();else setTimeout(tick,Math.min(80,remain));};
  setTimeout(tick,16);
});

const DECK_DIST=[["杀",30],["闪",18],["桃",10],["酒",4],
 ["无懈可击",6],["无中生有",4],["顺手牵羊",4],["过河拆桥",5],["决斗",4],
 ["借刀杀人",2],["乐不思蜀",3],["闪电",2],["南蛮入侵",3],["万箭齐发",2],["桃园结义",2],["五谷丰登",2],
 ["诸葛连弩",2],["雌雄双股剑",1],["青釭剑",1],["青龙偃月刀",1],["丈八蛇矛",1],["贯石斧",1],["方天画戟",1],["麒麟弓",1],["寒冰剑",1],
 ["八卦阵",2],["仁王盾",1],
 ["绝影",1],["爪黄飞电",1],["的卢",1],["大宛",1],["赤兔",1],["紫骍",1]];
function buildDeck(){
  const d=[];
  for(const [name,n] of DECK_DIST){
    const c=CARD_DEFS[name];
    for(let i=0;i<n;i++){
      let suit;
      if(c.sub==="sha")suit=["S","C","C","H","D"][rnd(5)];
      else if(c.sub==="tao"||c.sub==="shan")suit=["H","D","H","D"][rnd(4)];
      else suit=["S","C","H","D"][rnd(4)];
      d.push({id:uid(),name,suit,rank:1+rnd(13),cat:c.cat,sub:c.sub,range:c.range});
    }
  }
  return shuffle(d);
}

let modalToken=0;
function openModal(html){
  closeModal();
  const m=document.createElement("div");m.className="modal-mask";
  m.innerHTML=`<div class="modal">${html}</div>`;
  $("#modalRoot").appendChild(m);return m;
}
function closeModal(){$("#modalRoot").innerHTML="";}
function modalPromise(builder){
  return new Promise(res=>{
    const tok=++modalToken;
    const close=v=>{if(tok===modalToken){modalToken=0;closeModal();res(v);}};
    builder(close);
  });
}
function confirmModal(html,ok="确 定",cancel="取 消"){
  return modalPromise(close=>{
    openModal(`${html}<div class="mfoot">
      <button class="btn" id="mCancel">${cancel}</button>
      <button class="btn btn-primary" id="mOk">${ok}</button></div>`);
    $("#mOk").onclick=()=>close(true);
    $("#mCancel").onclick=()=>close(false);
  });
}
function chooseCardsModal(o){
  // {title,text,cards,min,max,ok,cancel,disabledIds:Set,extraBtns:[{label,onClick}]}
  return modalPromise(close=>{
    const sel=new Set();
    const disabledIds=o.disabledIds||new Set();
    openModal(`<h3>${o.title}</h3>
      ${o.text?`<div class="mbody" style="text-align:center">${o.text}</div>`:""}
      <div class="pick-grid" id="pickCards">
        ${o.cards.map(c=>`<div data-cid="${c.id}" class="${disabledIds.has(c.id)?"illegal":""}">${cardFace(c)}</div>`).join("")}
      </div>
      <div class="mfoot">${(o.extraBtns||[]).map((b,i)=>`<button class="btn" id="extra${i}">${b.label}</button>`).join("")}
      ${o.cancel!==null?`<button class="btn" id="pickCancel">${o.cancel||"取 消"}</button>`:""}
      <button class="btn btn-primary" id="pickOk" disabled>${o.ok||"确 定"}（已选0）</button></div>`);
    const render=()=>{
      $$("#pickCards .card").forEach(el=>{
        const c=o.cards.find(x=>x.id===el.dataset.cid);
        el.classList.toggle("sel",sel.has(c.id));
        el.classList.toggle("illegal",disabledIds.has(c.id));
      });
      $("#pickOk").disabled=sel.size<o.min;
      $("#pickOk").textContent=`${o.ok||"确 定"}（已选${sel.size}）`;
    };
    $$("#pickCards .card").forEach(el=>{
      el.onclick=()=>{
        const c=o.cards.find(x=>x.id===el.dataset.cid);
        if(disabledIds.has(c.id))return;
        if(sel.has(c.id))sel.delete(c.id);
        else{if(sel.size>=o.max){if(o.max===1){sel.clear();}else return;}sel.add(c.id);}
        render();
      };
    });
    $("#pickOk").onclick=()=>close(o.cards.filter(c=>sel.has(c.id)));
    if(o.cancel!==null)$("#pickCancel").onclick=()=>close(null);
    (o.extraBtns||[]).forEach((b,i)=>{$("#extra"+i).onclick=()=>b.onClick(close,render);});
    render();
  });
}
function optionsModal(title,body,opts,canCancel=true){
  // opts:[{key,title,desc,disabled}]；先选中再确定，防误触
  return modalPromise(close=>{

      <div class="opt-list">
        ${opts.map((o,i)=>`<div class="opt ${o.disabled?"disabled":""}" data-i="${i}">
          <div class="ot">${o.title}</div>${o.desc?`<div class="od">${o.desc}</div>`:""}
        </div>`).join("")}
      </div>
      <div class="mfoot">${canCancel?'<button class="btn" id="optCancel">取 消</button>':""}
      <button class="btn btn-primary" id="optOk" disabled>确 定</button></div>`);
    $$("#modalRoot .opt").forEach(el=>{
      el.onclick=()=>{const i=+el.dataset.i;if(opts[i].disabled)return;
        sel=i;$$("#modalRoot .opt").forEach(x=>x.classList.toggle("sel",+x.dataset.i===sel));

  });
}

      <button class="btn btn-primary" id="msOk" disabled>确 定（已选0）</button></div>`);
    $$("#msList .opt").forEach(el=>{
      el.onclick=()=>{
        const i=+el.dataset.i;

function sortedItems(list,sort,nameF,diffF){
  const a=[...list];
  a.sort((x,y)=>{
    if(sort===0)return nameF(x).localeCompare(nameF(y),"zh");
    if(sort===1)return nameF(y).localeCompare(nameF(x),"zh");
    if(sort===2)return diffF(x)-diffF(y);
    return diffF(y)-diffF(x);
  });
  return a;
}

function fxBurst(el,color="#ffd24c"){
  if(!CFG.fx||!el)return;
  const r=el.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const d=document.createElement("div");d.className="fx-burst";
    d.style.background=color;d.style.left=(r.left+r.width/2)+"px";d.style.top=(r.top+r.height/2)+"px";
    document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,dist=30+Math.random()*50;
    setTimeout(()=>{d.style.transform=`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px)`;d.style.opacity="0";},20);

  document.body.appendChild(d);

  if(faceUp)el.innerHTML=`<div class="corner"><div class="r">${rankText(card.rank)}</div><div class="s">${SUITS[card.suit]}</div></div><div class="cname">${card.name}</div>`;

function deckPop(){
  if(!G.deck.length){
    if(!G.discard.length)return null;
    G.deck=shuffle(G.discard);G.discard=[];G.deck.forEach(x=>x._out=false);
    log("牌堆已洗空，弃牌堆重洗为新牌堆","sys");
  }
  return G.deck.pop();
}

function loseHand(p,c){
  const i=c?p.hand.findIndex(x=>x.id===c.id):-1;
  if(i>=0)p.hand.splice(i,1);
  if(p.alive&&p.hand.length===0&&hasSkill(p,"连营")){
    const nc=deckPop();
    if(nc){p.hand.push(nc);log(`${pName(p)}发动【连营】，摸一张牌`,"good");renderHand();}
  }
}
async function drawCards(p,n,opts={}){
  for(let i=0;i<n;i++){
    const c=deckPop();if(!c)break;
    p.hand.push(c);
    if(CFG.fx&&!opts.silent)await flyCard(c,$("#deckPile"),$("#seat"+p.seat),false);
    renderAll();
    if(!opts.silent)await wait(140);
  }
}

  CFG.xray=false;

  G={players:[],deck:[],discard:[],round:1,turnSeat:0,cur:null,phase:"",over:false,paused:false,_dpause:false,
     targetPick:null,humanDead:false,center:[],judgeView:null,logs:[],drawResolve:null};
  /* 身份 */
  const plan=ID_PLANS[n][CFG.schemes[n]||0][0];
  let ids=shuffle([...plan]);
  if(CFG.ownIdentity){
    const i=ids.indexOf(CFG.ownIdentity);
    if(i>=0)[ids[0],ids[i]]=[ids[i],ids[0]];
    else ids[0]=CFG.ownIdentity;
  }
  for(let i=0;i<n;i++){
    G.players.push({seat:i,isAI:i!==HUMAN,generalId:null,identity:ids[i],
      hp:0,maxHp:0,hand:[],eq:{weapon:null,armor:null,up:null,down:null},judge:[],alive:true,thinking:false,
      f:{lebu:false,luoyi:false,jiuSha:false,shaCount:0,rendeGiven:0,rendeHealed:false},used:{}});
  }
  /* 发将候选 */
  const pool=shuffle(GENERALS.filter(g=>CFG.enabledGenerals.has(g.id)).map(g=>g.id));
  const need=Math.min(CFG.generalChoices,pool.length-1);
  const picks=[];
  for(const p of G.players){
    if(!p.isAI&&CFG.ownGeneral){p.cands=[CFG.ownGeneral];picks.push(p);continue;}
    const cands=[];
    while(cands.length<need){
      const id=pool.pop();
      if(!id)break;
      cands.push(id);
    }
    p.cands=cands;picks.push(p);

/*================ 整轮制回合循环 ================*/
async function gameLoop(){
  while(!G.over){
    await roundCountdown();
    if(G.over)break;
    const order=G.players.slice(G.turnSeat).concat(G.players.slice(0,G.turnSeat));
    for(const p of order){
      if(G.over)break;
      if(!p.alive)continue;
      try{
        await runTurn(p);
      }catch(err){
        log("回合执行异常，已跳过："+(err.message||err),"hit");console.error(err);
        G.center=[];if(G.targetPick){const rr=G.targetPick.resolve;G.targetPick=null;rr(null);}
        stopPlayTimer();renderAll();
      }
      await wait(600); // 轮与轮之间的观感停顿
    }
    if(!G.over)G.round++;
  }
}
async function roundCountdown(){
  for(let i=5;i>=1;i--){
    if(G.over)return;
    setPhaseText(`第${zhNum(G.round)}回合准备中`);
    const el=document.createElement("div");el.className="cd-mask";
    el.innerHTML=`<div class="cd-t">${i}秒后开始第${zhNum(G.round)}回合</div><div class="cd-n">${i}</div>`;
    $("#game").appendChild(el);
    await wait(1000);
    el.remove();
  }
  setPhaseText(`第${zhNum(G.round)}回合准备阶段`);
  await wait(700);
}
function setPhaseText(t){$("#phaseText").textContent=t;}
async function runTurn(p){
  p.used={};p.f={lebu:false,luoyi:false,jiuSha:false,shaCount:0,rendeGiven:0,rendeHealed:false};
  G.cur=p.seat;renderSeats();
  if(hasSkill(p,"洛神"))await skillLuoshen(p);
  if(hasSkill(p,"观星"))await skillGuanxing(p);
  if(G.over)return;
  setPhase(p,"judge");await judgePhase(p);
  if(G.over)return;
  setPhase(p,"draw");await drawPhase(p);
  if(G.over)return;
  setPhase(p,"play");
  if(p.f.lebu){log(`${pName(p)}被乐不思蜀影响，跳过出牌阶段`,"sys");if(p.seat===HUMAN)toast("你被乐不思蜀了，跳过出牌阶段！");await wait(800);}
  else if(p.isAI)await aiPlayPhase(p);
  else await humanPlayPhase();
  if(G.over)return;
  setPhase(p,"discard");await discardPhase(p);
  if(G.over)return;
  if(hasSkill(p,"闭月")&&p.alive){
    const yes=p.isAI?true:await confirmModal(`<h3>闭月</h3><div class="mbody">回合结束，是否发动【闭月】摸一张牌？</div>`);
    if(yes){log(`${pName(p)}发动【闭月】，摸一张牌`,"good");await drawCards(p,1);}
  }
  setPhase(p,"end");renderAll();await wait(400);
}
function setPhase(p,ph){
  G.phase=ph;
  const names={judge:"判定阶段",draw:"摸牌阶段",play:"出牌阶段",discard:"弃牌阶段",end:"回合结束"};
  setPhaseText(`第${zhNum(G.round)}回合 · ${pName(p)}${genOf(p).name} · ${names[ph]}`);
  renderSeats();
}
/*================ 回合开始技能 ================*/
async function skillLuoshen(p){

    `<h3>洛神</h3><div class="mbody" style="text-align:center">回合开始，是否发动【洛神】进行判定？</div>`,"发动","不发动");

      renderAll();await wait(300);
    }else{
      toDiscard(c);log(`【洛神】判定为红色，停止`,"sys");

async function skillGuanxing(p){
  const cnt=Math.min(G.players.filter(x=>x.alive).length,5);
  const peek=[];
  for(let i=0;i<cnt;i++)peek.push(deckPop());
  let order;
  if(p.isAI){order=peek;}
  else{
    order=await new Promise(res=>{
      let arr=[...peek],bottom=[];
      const renderM=()=>{
        $("#gxList").innerHTML=arr.map((c,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px">
          ${cardFace(c)}
          <div style="display:flex;gap:3px">
            <button class="btn btn-sm" ${i===0?"disabled":""} onclick="gxMove(-1,${i})">↑</button>
            <button class="btn btn-sm" ${i===arr.length-1?"disabled":""} onclick="gxMove(1,${i})">↓</button>
            <button class="btn btn-sm" onclick="gxBottom(${i})">置底</button>
          </div></div>`).join("");
        $("#gxBottom").innerHTML=bottom.length?`<div style="color:#cbb387;font-size:13px;width:100%;text-align:center">牌堆底（顺序）：</div>`+bottom.map(c=>cardFace(c)).join(""):"";
      };
      window.gxMove=(d,i)=>{const j=i+d;[arr[i],arr[j]]=[arr[j],arr[i]];renderM();};
      window.gxBottom=i=>{bottom.push(arr.splice(i,1)[0]);renderM();};
      openModal(`<h3>观星</h3>
        <div class="mbody" style="text-align:center">观看牌堆顶 ${cnt} 张牌，调整顺序（左→右即牌堆顶→底）：</div>
        <div class="pick-grid" id="gxList" style="align-items:flex-start"></div>
        <div class="pick-grid" id="gxBottom" style="border-top:1px dashed #8a6a35;margin-top:8px;padding-top:8px"></div>
        <div class="mfoot"><button class="btn btn-primary" onclick="(window.__gxClose||function(){})()">确 定</button></div>`);
      window.__gxClose=()=>{closeModal();res([...arr,...bottom]);};
      renderM();
    });
  }
  G.deck.push(...order.slice().reverse());
  log(`${pName(p)}发动【观星】，观看牌堆顶${cnt}张牌并调整顺序`,"good");
  renderAll();
}
/*================ 判定阶段 ================*/
async function doJudge(target,text,ctx){
  let c=deckPop();
  G.judgeView={card:c,text:text+"：判定中…"};renderJudgeStand();
  log(`${pName(target)}【${text}】判定牌为 ${SUITS[c.suit]}${rankText(c.rank)}（${c.name}）`,"sys");
  await wait(700);
  /* 鬼才 */
  const sima=G.players.find(p=>p.alive&&hasSkill(p,"鬼才"));
  if(sima){
    let picked=null;
    if(sima.isAI)picked=aiGuicai(sima,c,ctx,target);
    else{
      const use=await confirmModal(
        `<h3>鬼才</h3><div class="mbody" style="text-align:center">${pName(target)}的判定牌为 <b>${SUITS[c.suit]}${rankText(c.rank)}</b>，是否打出一张手牌替换之？</div>`);
      if(use){
        const m=await chooseCardsModal({title:"鬼才：选择一张手牌替换判定牌",cards:sima.hand,min:1,max:1,ok:"替换"});
        if(m&&m.length)picked=m[0];
      }
    }
    if(picked){
      loseHand(sima,picked);toDiscard(c);c=picked;
      log(`${pName(sima)}发动【鬼才】，以 ${SUITS[c.suit]}${rankText(c.rank)} 替换判定牌`,"good");
      G.judgeView={card:c,text:text+"：鬼才改判"};renderJudgeStand();
      await wait(500);
    }
  }
  /* 天妒 */
  if(hasSkill(target,"天妒")&&target.alive){
    const get=target.isAI?true:await confirmModal(
      `<h3>天妒</h3><div class="mbody" style="text-align:center">是否获得你的判定牌 <b>${c.name}（${SUITS[c.suit]}${rankText(c.rank)}）</b>？</div>`);
    if(get){target.hand.push(c);log(`${pName(target)}发动【天妒】，获得判定牌【${c.name}】`,"good");G.judgeView=null;renderAll();return c;}
  }
  G.judgeView=null;renderJudgeStand();
  return c;
}
async function judgePhase(p){
  for(const jc of [...p.judge]){
    if(!p.alive||G.over)return;
    if(jc.name==="乐不思蜀"){
      const c=await doJudge(p,"乐不思蜀",{type:"lebu"});
      const i=p.judge.findIndex(x=>x.id===jc.id);
      if(i>=0)p.judge.splice(i,1);
      if(!G.discard.find(x=>x.id===c.id)&&!p.hand.find(x=>x.id===c.id))toDiscard(c);
      if(c.suit==="H"){log(`${pName(p)}的乐不思蜀判定为红桃，未生效`,"good");}
      else{p.f.lebu=true;log(`${pName(p)}的乐不思蜀生效，将跳过出牌阶段`,"hit");if(p.seat===HUMAN)toast("你被乐不思蜀了，跳过出牌阶段！");}
    }else if(jc.name==="闪电"){
      const c=await doJudge(p,"闪电",{type:"shandian"});
      const i=p.judge.findIndex(x=>x.id===jc.id);
      if(i>=0)p.judge.splice(i,1);
      if(c.suit==="S"&&c.rank>=2&&c.rank<=9){
        if(!G.discard.find(x=>x.id===c.id)&&!p.hand.find(x=>x.id===c.id))toDiscard(c);
        log(`${pName(p)}的闪电判定命中黑桃2~9！受到3点雷电伤害`,"hit");
        if(p.seat===HUMAN)toast("你的闪电判定命中，受到3点雷电伤害！");
        await wait(500);
        await damage(p,3,null,jc,{lightning:true});
      }else{
        if(!G.discard.find(x=>x.id===c.id)&&!p.hand.find(x=>x.id===c.id))toDiscard(c);
        const np=G.players[(p.seat+1)%G.players.length];
        if(np&&np.alive&&!np.judge.find(x=>x.name==="闪电")){np.judge.push(jc);log(`闪电未生效，转移给${pName(np)}`,"sys");}
        else toDiscard(jc);
      }
    }
    renderAll();await wait(400);
  }
}

async function drawPhase(p){
  let n=2+(hasSkill(p,"英姿")?1:0);
  if(hasSkill(p,"裸衣")){
    const yes=p.isAI?aiLuoyi(p):await optionsModal("裸衣","摸牌阶段是否少摸一张牌，令本回合【杀】/【决斗】伤害+1？",
      [{key:"luo",title:"发动裸衣（少摸一张，伤害+1）"},{key:"no",title:"正常摸牌"}]);
    if(yes==="luo"){p.f.luoyi=true;n=Math.max(1,n-1);log(`${pName(p)}发动【裸衣】，本回合杀/决斗伤害+1`,"good");}
  }
  if(hasSkill(p,"突袭")){
    const targets=others(p).filter(x=>x.hand.length>0);
    const yes=p.isAI?(CFG.aiLevel>=3&&targets.length&&Math.random()<0.7):
      (targets.length?await optionsModal("突袭","是否放弃摸一张牌，改为获得一名其他角色的一张手牌？",
        [{key:"t",title:"发动突袭"},{key:"no",title:"正常摸牌"}]):"no");
    if(yes==="t"){
      n--;
      let tgt;
      if(p.isAI)tgt=aiPickTargetCard(p,targets);
      else{toast("选择【突袭】目标");tgt=await pickTarget(targets,"突袭：选择一名有手牌的角色");}
      if(tgt){
        const c=tgt.hand.splice(rnd(tgt.hand.length),1)[0];
        p.hand.push(c);
        log(`${pName(p)}发动【突袭】，获得${pName(tgt)}的一张手牌`,"good");
        renderAll();
      }
    }
  }
  if(p.isAI){
    log(`${pName(p)}摸牌阶段，摸${n}张牌`,"sys");
    await think(p);await drawCards(p,n);
  }else{
    await new Promise(res=>{G.drawResolve=res;renderActionBar();});
    await drawCards(p,n);
    log(`你摸了${n}张牌`,"sys");
  }
}
function humanDrawClick(){if(G.drawResolve){const r=G.drawResolve;G.drawResolve=null;r();}}
/*================ 弃牌阶段 ================*/
async function discardPhase(p){
  if(hasSkill(p,"克己")&&(p.used.shaCount||0)===0){
    log(`${pName(p)}发动【克己】，本回合未出杀，跳过弃牌阶段`,"good");
    return;
  }
  const keep=(CFG.cheatOn&&CFG.cheatKeep!=null)?CFG.cheatKeep:hasSkill(p,"英姿")?p.maxHp:p.hp;
  let need=Math.max(0,p.hand.length-keep);
  if(need===0){return;}
  let picks;
  if(p.isAI){
    await think(p);picks=aiDiscard(p,need);
  }else{
    picks=await chooseCardsModal({title:`弃牌阶段：选择弃置 ${need} 张牌`,
      text:`你当前 ${p.hand.length} 张手牌，须弃置 <b style="color:#ff9a8a">${need}</b> 张`,
      cards:p.hand,min:need,max:need,ok:"确认弃置",cancel:"自动弃置"});
    if(!picks)picks=aiDiscard(p,need);
  }
  for(const c of picks){
    loseHand(p,c);
    if(CFG.fx)await flyCard(c,$("#seat"+p.seat),$("#discardPile"),false);
    toDiscard(c);
  }
  log(`${pName(p)}弃掉了${need}张牌：${picks.map(c=>"【"+c.name+"】").join("")}`,"sys");
  if(p.seat!==HUMAN)toast(`${pName(p)}弃掉了${need}张牌`);
  renderAll();
}
/*================ 装备 ================*/
function equipCard(p,c){
  let slot=null;
  if(c.sub==="weapon")slot="weapon";else if(c.sub==="armor")slot="armor";
  else if(c.sub==="mountU")slot="up";else if(c.sub==="mountD")slot="down";
  loseHand(p,c);
  const old=p.eq[slot];
  p.eq[slot]=c;
  if(old){toDiscard(old);xiaojiTrigger(p);}
  log(`${pName(p)}装备了【${c.name}】${c.range?`（攻击范围${c.range}）`:""}`);
  renderAll();
}
function removeEquip(p,slot,to){
  const c=p.eq[slot];if(!c)return null;
  p.eq[slot]=null;
  if(to)to.hand.push(c);else toDiscard(c);
  xiaojiTrigger(p);
  renderAll();return c;
}
function xiaojiTrigger(p){
  if(p.alive&&hasSkill(p,"枭姬")){log(`${pName(p)}发动【枭姬】，摸两张牌`,"good");drawCards(p,2);}
}
/*================ 伤害/濒死/死亡 ================*/
async function damage(tgt,amount,src,card,opts={}){
  if(!tgt.alive||G.over)return;
  tgt.hp-=amount;
  fxBurst($("#seat"+tgt.seat),"#ff5a4c");fxText($("#seat"+tgt.seat),"-"+amount);
  const srcTxt=src?pName(src):"雷电";
  log(`${srcTxt}对${pName(tgt)}造成${amount}点伤害（${tgt.hp}血）`,"hit");
  if(tgt.seat===HUMAN)toast(`你受到了${amount}点伤害！${card?`（来自${src?pName(src):""}的【${card.name}】）`:""}`);
  else if(src&&src.seat===HUMAN)toast(`你对${pName(tgt)}造成${amount}点伤害`);
  renderSeats();
  await wait(800); // 观感停顿
  if(tgt.hp<=0)await dying(tgt,src,card);
  if(tgt.alive&&amount>0)await postDamageSkills(tgt,src,card,opts);
  renderAll();
  checkWin();
}
async function dying(tgt,src,card){
  log(`${pName(tgt)}进入濒死状态，需要桃/酒救援！`,"hit");
  if(tgt.seat===HUMAN)toast("你濒死了！请使用【桃】或【酒】自救");
  const n=G.players.length;
  for(let k=0;k<n;k++){
    if(tgt.hp>=1||!tgt.alive)break;
    const p=G.players[(tgt.seat+k)%n];
    if(!p.alive)continue;
    const saveOpts=effectiveCards(p,"save",{self:p===tgt});
    let pick;
    if(p.isAI){
      if(saveOpts.length)await think(p);
      pick=aiSave(p,tgt,saveOpts);
    }else pick=await humanSave(p,tgt,saveOpts);
    if(pick){
      const {c,via}=pick;
      loseHand(p,c);toDiscard(c);
      let heal=1;
      if(c.sub==="jiu")p.used.jiuSaveThisTurn=true;
      if(hasSkill(tgt,"救援")&&tgt.identity==="lord"&&genOf(p).k==="吴"&&c.sub==="tao"){heal=2;log(`【救援】发动，${pName(p)}的桃额外回复1点体力`,"good");}
      tgt.hp+=heal;
      log(`${pName(p)}使用${via?`【${via}】`:""}【${c.name}】救了${pName(tgt)}，回复${heal}点体力`,"good");
      if(p.seat===HUMAN)toast(`你使用【${c.name}】救了${pName(tgt)}`);
      fxBurst($("#seat"+tgt.seat),"#5be08a");fxText($("#seat"+tgt.seat),"+"+heal,"fx-heal");
      renderSeats();await wait(700);
    }
  }
  if(tgt.hp<1)await die(tgt,src);
}
async function die(tgt,src){
  tgt.alive=false;tgt.hp=0;
  log(`${pName(tgt)}（${genOf(tgt).name}）阵亡！`,"hit");
  fxBurst($("#seat"+tgt.seat),"#777");
  for(const c of tgt.hand)toDiscard(c);tgt.hand=[];
  for(const slot of ["weapon","armor","up","down"])if(tgt.eq[slot]){toDiscard(tgt.eq[slot]);tgt.eq[slot]=null;}
  for(let i=tgt.judge.length-1;i>=0;i--){toDiscard(tgt.judge[i]);tgt.judge.splice(i,1);}
  renderAll();await wait(600);
  if(src&&src.alive){
    if(tgt.identity==="zei"){
      log(`${pName(src)}击杀反贼，奖励摸3张牌`,"good");
      if(src.seat===HUMAN)toast("你击杀了反贼，摸3张牌！");
      await drawCards(src,3);
    }else if(tgt.identity==="zhong"&&src.identity==="lord"){
      log(`主公误杀忠臣，弃光所有手牌与装备！`,"hit");
      if(src.seat===HUMAN)toast("你误杀忠臣，弃光所有牌！");
      for(const c of [...src.hand]){loseHand(src,c);toDiscard(c);}
      for(const slot of ["weapon","armor","up","down"])if(src.eq[slot]){toDiscard(src.eq[slot]);src.eq[slot]=null;}
      renderAll();
    }
  }
  if(tgt.seat===HUMAN&&!G.humanDead){
    G.humanDead=true;
    confirmModal(`<h3 style="color:#ff9a8a">你死亡了</h3>
      <div class="mbody" style="text-align:center">你的武将【${genOf(tgt).name}】已阵亡。<br>可以继续观战，也可以退出对局。</div>`,
      "退出对局","继续观战").then(exit=>{if(exit){G.over=true;goHome();}});
  }
  checkWin();
}
function checkWin(){
  if(G.over)return;
  const alive=G.players.filter(p=>p.alive);
  const lord=alive.find(p=>p.identity==="lord");
  const zeis=alive.some(p=>p.identity==="zei");
  const nei=alive.find(p=>p.identity==="nei");
  let win=null;

}

/*================ 距离 ================*/
function seatDist(a,b){
  if(a===b)return 0;
  const n=G.players.length;
  const d=Math.abs(a.seat-b.seat);
  return Math.min(d,n-d);
}
function dist(a,b){
  let d=seatDist(a,b);
  if(hasSkill(b,"马术"))d-=1;
  if(b.eq.up)d+=1;
  if(hasSkill(a,"马术"))d-=1;
  if(a.eq.down)d-=1;
  return Math.max(1,d);
}
function attackRange(p){
  return p.eq.weapon?p.eq.weapon.range:1;
}
function inShaRange(a,b){return dist(a,b)<=attackRange(a);}
function trickDistOk(a,cardName){
  if(cardName==="顺手牵羊"&&hasSkill(a,"奇才"))return true;
  return true;
}

/*================ 可用牌转化 ================*/
function virtualColorless(c){return c._virtual&&c._colorless;}
function effectiveCards(p,need,ctx={}){
  // need: "sha"|"shan"|"tao"|"save"|"wuxie";返回可用牌数组（含虚拟牌标记）
  const out=[];
  const add=(c,as)=>{out.push({...c,_base:c.id,_as:as,_virtual:true,_colorless:true,id:c.id+"::"+as});};
  if(need==="sha"){
    p.hand.forEach(c=>{
      if(c.sub==="sha")out.push({...c,_virtual:false});
      else if(hasSkill(p,"武圣")&&SUIT_RED[c.suit])add(c,"武圣");
      else if(hasSkill(p,"龙胆")&&c.sub==="shan")add(c,"龙胆");
    });
    if(p.hand.length>=2&&p.eq.weapon&&p.eq.weapon.name==="丈八蛇矛"&&!ctx.response)
      add({...p.hand[0],name:"杀"},"丈八蛇矛");
  }else if(need==="shan"){
    p.hand.forEach(c=>{
      if(c.sub==="shan")out.push({...c,_virtual:false});
      else if(hasSkill(p,"龙胆")&&c.sub==="sha")add(c,"龙胆");
      else if(hasSkill(p,"倾国")&&(c.suit==="S"||c.suit==="C"))add(c,"倾国");
    });
  }else if(need==="tao"||need==="save"){
    p.hand.forEach(c=>{
      if(c.sub==="tao")out.push({...c,_virtual:false});
      else if(c.sub==="jiu"&&need==="save"&&ctx.self)out.push({...c,_virtual:false});
      else if(hasSkill(p,"急救")&&need==="save"&&!ctx.self&&SUIT_RED[c.suit])add(c,"急救");
    });
  }else if(need==="wuxie"){
    p.hand.forEach(c=>{if(c.sub==="trick"&&c.name==="无懈可击")out.push({...c,_virtual:false});});
  }
  return out;
}
async function requestResponse(p,need,ctx){
  // 返回实际打出的牌或null；ctx={reason,by,card,count,sha:本次杀,duel}
  if(!p.alive)return null;
  if(p.isAI){
    await think(p);
    const opts=effectiveCards(p,need,ctx);
    if(need==="shan"&&opts.length&&p.eq.armor&&p.eq.armor.name==="八卦阵"&&!ctx.noBagua){
      if(Math.random()<0.6){
        const j=await doJudge(p,"八卦阵",{type:"bagua"});
        if(SUIT_RED[j.suit]){log(`${pName(p)}【八卦阵】判定为红色，视为打出【闪】`,"good");return {bagua:true};}
        else if(!G.discard.find(x=>x.id===j.id)&&!p.hand.find(x=>x.id===j.id))toDiscard(j);
      }
    }
    if(need==="sha"&&p.hand.length===2&&p.eq.weapon&&p.eq.weapon.name==="丈八蛇矛"&&!opts.length){
      if(Math.random()<0.5){
        const c1=p.hand[0],c2=p.hand[1];
        loseHand(p,c1);loseHand(p,c2);toDiscard(c1);toDiscard(c2);
        log(`${pName(p)}发动【丈八蛇矛】，将两张手牌当【杀】打出`,"good");
        return {virtual:true};
      }
    }
    return aiRespond(p,need,ctx,opts);
  }
  const opts=effectiveCards(p,need,ctx);
  const c=await humanRespond(p,need,ctx,opts);
  return c;
}
function humanRespond(p,need,ctx,opts){
  const titles={sha:"需要打出【杀】",shan:"需要打出【闪】",tao:"需要使用【桃】",save:"需要救援",wuxie:"是否使用【无懈可击】？"};

    openModal(`<h3>${titles[need]||"响应"}</h3>

      </div>
      <div class="mfoot"><button class="btn btn-danger" id="pickCancel">跳 过</button>

/*================ 无懈可击链 ================*/
async function askWuxie(cardName,targets,src){
  // 返回 true 表示被无懈抵消
  let cur=0;
  while(true){
    let user=null,pick=null;
    for(const p of G.players){
      if(!p.alive)continue;
      const opts=effectiveCards(p,"wuxie");
      if(!opts.length)continue;
      const relevant=targets.length===0||targets.some(t=>p===t||aiWantsProtect(p,t));
      if(!relevant&&p.isAI)continue;
      if(p.isAI){
        await think(p);
        if(aiWuxie(p,cardName,targets,src,cur)){
          user=p;pick=opts[0];break;
        }
      }else{
        const r=await humanRespond(p,"wuxie",{desc:`${cardName}${targets.length?`（目标：${targets.map(pName).join("、")}）`:""}${cur?"（已被无懈过一次）":""}`},opts);
        if(r&&r.c){user=p;pick=r.c;break;}
      }
    }
    if(!user)return cur%2===1;
    loseHand(user,pick);toDiscard(pick);
    log(`${cur%2===1?"":"你的"}${pName(user)}使用【无懈可击】${cur?"抵消了无懈可击的效果":"抵消了【"+cardName+"】"}`,"sys");
    if(user.seat===HUMAN)toast(`你用【无懈可击】抵消了【${cardName}】`);
    centerAdd(pick,user);renderCenter();
    await wait(700);
    cur++;
  }
}
function aiWantsProtect(p,t){return t===p||aiRel(p,t)==="friend";}
/*================ 出牌（杀流程） ================*/
function centerAdd(card,by){G.center.push({card,by:by?by.seat:-1});if(G.center.length>8)G.center.shift();renderCenter();}
function centerClear(){G.center=[];renderCenter();}
function legalShaTargets(p){
  return others(p).filter(t=>{
    if(hasSkill(t,"空城")&&isKongcheng(t))return false;
    return inShaRange(p,t);
  });
}
function shaBlockedByRenwang(tgt,shaCard){
  return tgt.eq.armor&&tgt.eq.armor.name==="仁王盾"&&!SUIT_RED[shaCard.suit]&&!virtualColorless(shaCard)&&shaCard.suit;
}
async function castSha(p,tgts,card,via){
  // tgts: 玩家数组（1个，方天画戟最多3）
  const isVirtual=!!via;
  if(!isVirtual){
    loseHand(p,card);toDiscard(card);
    if(card.sub==="jiu")/*不可能*/;
  }else{
    // 虚拟杀：从手中移除基础牌
    if(via.base){loseHand(p,via.base);toDiscard(via.base);}
    if(via.base2){loseHand(p,via.base2);toDiscard(via.base2);}
  }
  p.used.shaCount=(p.used.shaCount||0)+1;
  log(`${pName(p)}对${tgts.map(pName).join("、")}使用了${isVirtual?`【${via.name}】转化的`:`【${card.name}】`}【杀】${p.f.jiuSha?"（酒杀）":""}`);
  centerAdd(isVirtual?{name:"杀",suit:via.suit||"S",rank:1,cat:"普通",sub:"sha"}:card,p);
  if(CFG.fx){fxBurst($("#seat"+p.seat),"#ff9a4c");}
  await wait(500);
  // 铁骑
  let noShan=false;
  if(hasSkill(p,"铁骑")){
    const use=p.isAI?Math.random()<0.8:await confirmModal(`<h3>铁骑</h3><div class="mbody">是否发动【铁骑】进行判定？</div>`);
    if(use){
      const j=await doJudge(p,"铁骑",{type:"tieqi"});
      if(j.suit!=="H"){noShan=true;log(`【铁骑】判定生效，此杀不可被闪响应`,"good");}
      else if(!G.discard.find(x=>x.id===j.id)&&!p.hand.find(x=>x.id===j.id))toDiscard(j);
    }
  }
  for(const tgt of tgts){
    if(G.over)return;
    await resolveShaOne(p,tgt,isVirtual?{...card,suit:via.suit||"S"}:card,noShan,via);
  }
  p.f.jiuSha=false;
}
async function resolveShaOne(p,tgt,card,noShan,via){
  if(!tgt.alive)return;
  /* 流离 */
  if(hasSkill(tgt,"流离")){
    let moved=null;
    const legal=others(tgt).filter(x=>x!==p&&inShaRange(tgt,x)&&tgt.hand.length>0);
    if(legal.length){
      if(tgt.isAI)moved=aiLiuli(tgt,p,legal);
      else moved=await humanLiuli(tgt,legal,p);
    }
    if(moved&&moved.c&&moved.t){
      loseHand(tgt,moved.c);toDiscard(moved.c);
      log(`${pName(tgt)}发动【流离】，将【杀】转移给${pName(moved.t)}`,"good");
      tgt=moved.t;
    }
  }
  /* 仁王盾 */
  if(shaBlockedByRenwang(tgt,card)){
    log(`【仁王盾】生效，黑色的【杀】对${pName(tgt)}无效`,"sys");
    if(p.seat===HUMAN)toast(`【仁王盾】生效，你的杀对${pName(tgt)}无效`);
    return;
  }
  /* 出闪（无双需两张） */
  const needShan=hasSkill(p,"无双")?2:1;
  let dodged=true,shanCount=0;
  for(let k=0;k<needShan;k++){
    const need2=k===0?false:false;
    const r=await requestResponse(tgt,"shan",{desc:needShan===2?`【无双】：需连续打出两张【闪】（第${k+1}/2张）`:"请打出【闪】响应【杀】",by:p,card});
    if(r&&r.c){shanCount++;dodged=needShan===1||k===1;}
    else{dodged=false;break;}
    if(needShan===1)dodged=true;
  }
  if(needShan===2)dodged=shanCount===2;
  if(dodged&&!noShan){
    log(`${pName(tgt)}${shanCount===2?"连续使用两张【闪】":"使用【闪】"}抵消了【杀】`);
    if(shanCount)centerAdd({name:"闪",suit:"H",rank:1,cat:"普通",sub:"shan"},tgt);
    await wait(800); // 响应观感停顿
    /* 青龙偃月刀 */
    if(p.eq.weapon&&p.eq.weapon.name==="青龙偃月刀"&&p.alive){
      const opts=effectiveCards(p,"sha",{response:true}).filter(c=>c.sub==="sha"||c._as==="武圣"||c._as==="龙胆");
      const use=p.isAI?(opts.length&&Math.random()<0.7):opts.length&&await confirmModal(`<h3>青龙偃月刀</h3><div class="mbody">【杀】被【闪】抵消，是否追加一张【杀】？</div>`);
      if(use){
        const pick=p.isAI?aiPickFrom(opts):await chooseCardsModal({title:"青龙偃月刀：选择一张【杀】追加",cards:opts,min:1,max:1});
        if(pick&&pick.length){
          const c=pick[0];
          await castSha(p,[tgt],c.sub==="sha"?c:null,{name:"杀",base:c.sub==="sha"?null:c,base2:null,suit:c.suit});
        }
      }
    }
    return;
  }
  if(noShan)log(`【铁骑】生效，${pName(tgt)}无法响应此【杀】`,"hit");
  /* 贯石斧强命 */
  if(dodged===false&&!noShan){/*闪没出*/}
  if(shanCount>=1&&needShan===1&&!noShan){/*已处理*/}
  // 实际未躲开 → 贯石斧/寒冰剑/雌雄 在命中前
  if(!noShan){
    /* 贯石斧：闪被抵消判定后仍有闪? 简化：若出闪了但贯石斧可强命 */
    if(shanCount>=1&&p.eq.weapon&&p.eq.weapon.name==="贯石斧"&&p.alive&&(p.hand.length+(p.eq.weapon?1:0))>=3){
      const use=p.isAI?(Math.random()<0.6&&p.hand.length>=2):(p.hand.length>=2?await confirmModal(`<h3>贯石斧</h3><div class="mbody">是否弃置两张牌强制命中？</div>`):false);
      if(use){
        let disc=[];
        if(p.isAI){disc=aiDiscard(p,2,true);}
        else{
          disc=await chooseCardsModal({title:"贯石斧：弃置两张牌",cards:p.hand,min:2,max:2});
          if(!disc)return;
        }
        for(const c of disc){loseHand(p,c);toDiscard(c);}
        log(`${pName(p)}发动【贯石斧】，弃置两张牌强制命中`,"good");
        await wait(500);
        await applyShaDamage(p,tgt,card);
        return;
      }
    }
  }
  /* 雌雄双股剑 */
  if(p.eq.weapon&&p.eq.weapon.name==="雌雄双股剑"&&genOf(p).gender!==genOf(tgt).gender){
    const choice=tgt.isAI?(tgt.hand.length?Math.random()<0.5?"discard":"hurt":(tgt.eq.weapon||tgt.eq.armor?"hurt":"discard")):
      await optionsModal(`雌雄双股剑`,`${pName(p)}对你使用【杀】，选择：`,[
        {key:"discard",title:"弃置一张手牌",desc:"避免受伤",disabled:tgt.hand.length===0},
        {key:"hurt",title:"受到1点伤害",disabled:tgt.hand.length>0&&(tgt.eq.weapon||tgt.eq.armor)&&false}]);
    if(choice==="discard"&&tgt.hand.length){
      const c=tgt.hand.splice(rnd(tgt.hand.length),1)[0];toDiscard(c);
      log(`${pName(tgt)}因【雌雄双股剑】弃置一张手牌`);
    }else{
      log(`${pName(tgt)}因【雌雄双股剑】受到1点伤害`,"hit");
      await wait(500);await damage(tgt,1,p,card);
    }
    return;
  }
  await applyShaDamage(p,tgt,card);
}
async function applyShaDamage(p,tgt,card){
  if(!tgt.alive)return;
  /* 寒冰剑 */
  if(p.eq.weapon&&p.eq.weapon.name==="寒冰剑"&&tgt.hand.length+tgt.eq.weapon+tgt.eq.armor+1>1){
    const use=p.isAI?Math.random()<0.4:(tgt.hand.length>=2?await optionsModal("寒冰剑","【杀】命中，是否改为弃置对方两张牌（代替伤害）？",
      [{key:"ice",title:"弃置两张牌（无伤害）"},{key:"dmg",title:"正常造成伤害"}]):false);
    if(use==="ice"||use===true){
      for(let i=0;i<2;i++){
        let c=null;
        if(tgt.hand.length)c=tgt.hand.splice(rnd(tgt.hand.length),1)[0];
        else if(tgt.eq.weapon)c=removeEquip(tgt,"weapon");
        else if(tgt.eq.armor)c=removeEquip(tgt,"armor");
        if(c){toDiscard(c);log(`${pName(tgt)}被【寒冰剑】弃置了【${c.name}】`);}
        else break;
      }
      return;
    }
  }
  let dmg=1+(p.f.jiuSha?1:0)+(p.f.luoyi?1:0);
  /* 麒麟弓 */
  if(p.eq.weapon&&p.eq.weapon.name==="麒麟弓"&&(tgt.eq.up||tgt.eq.down)){
    const use=p.isAI?Math.random()<0.7:(tgt.eq.up||tgt.eq.down)?await confirmModal(`<h3>麒麟弓</h3><div class="mbody">是否弃置${pName(tgt)}的一匹坐骑？</div>`):false;
    if(use){
      const slot=tgt.eq.up?"up":"down";
      const c=removeEquip(tgt,slot);
      if(c)log(`${pName(p)}发动【麒麟弓】，弃置${pName(tgt)}的【${c.name}】`,"good");
    }
  }
  /* 青釭剑无视防具标记 */
  await damage(tgt,dmg,p,card,{piercing:p.eq.weapon&&p.eq.weapon.name==="青釭剑"});
  await wait(600);
}

async function castTrick(p,card){
  if(card.sub==="trick"){loseHand(p,card);toDiscard(card);}
  centerAdd(card,p);
  if(CFG.fx)fxBurst($("#seat"+p.seat),"#b98aff");
  if(hasSkill(p,"集智")&&card.sub==="trick"){
    log(`${pName(p)}发动【集智】，摸一张牌`,"good");
    await drawCards(p,1,{silent:true});
  }
  await wait(500);
}
async function finishTrick(card){centerClear();}
function trickTargetsLegal(p,cardName){
  const os=others(p);
  if(cardName==="顺手牵羊"){
    return os.filter(t=>{
      if(hasSkill(t,"谦逊"))return false;
      if(hasSkill(p,"奇才"))return true;
      return dist(p,t)===1;
    }).filter(t=>hasAnyCard(t));
  }
  if(cardName==="过河拆桥")return os.filter(t=>!hasSkill(t,"谦逊")&&hasAnyCard(t));
  if(cardName==="乐不思蜀")return os.filter(t=>!hasSkill(t,"谦逊")&&!t.judge.some(c=>c.name==="乐不思蜀"));
  if(cardName==="借刀杀人")return os.filter(t=>t.eq.weapon&&others(t).some(x=>inShaRange(t,x)&&x!==p));
  if(cardName==="决斗")return os.filter(t=>!(hasSkill(t,"空城")&&isKongcheng(t)));
  return os;
}

async function duelLoop(a,b,card){
  let atk=a,def=b,turn=0;
  while(atk.alive&&def.alive&&!G.over){
    const needShas=hasSkill(a,"无双")&&hasSkill(b,"无双")?2:(hasSkill(atk,"无双")?2:1);
    let responded=true;
    for(let k=0;k<needShas;k++){
      const r=await requestResponse(def,"sha",{desc:needShas===2?`【无双】决斗：需打出两张【杀】（第${k+1}/2张）`:`【决斗】：${pName(atk)}要求你打出【杀】`,by:atk,duel:true});
      if(r&&r.c){
        const c=r.c;
        if(!c._virtual&&c.sub==="sha"){loseHand(def,c);toDiscard(c);}
        else if(c._as==="武圣"||c._as==="龙胆"){const base=def.hand.find(x=>x.id===c._base);if(base){loseHand(def,base);toDiscard(base);}}
        else if(c._virtual){}
        log(`${pName(def)}打出【杀】响应【决斗】`);
        centerAdd({name:"杀",suit:c.suit||"S",rank:1,cat:"普通",sub:"sha"},def);
        await wait(700);
      }else{responded=false;break;}
    }
    if(!responded){
      log(`${pName(def)}未打出【杀】，决斗失败受到1点伤害`,"hit");
      await wait(500);
      await damage(def,1,atk,card,{luoyiSrc:atk});
      break;
    }
    [atk,def]=[def,atk];turn++;
    if(turn>30)break;
  }
}
async function trickJiedao(p,card){
  await castTrick(p,card);
  const armed=others(p).filter(t=>t.eq.weapon);
  const t1=p.isAI?aiPickFrom(armed.filter(t=>others(t).some(x=>inShaRange(t,x)))):null;
  const t2=p.isAI?(t1?aiChooseTarget(p,others(t1).filter(x=>inShaRange(t1,x))):null):null;
  let victim=t2;
  if(!p.isAI){
    toast("借刀杀人：先选装备武器者");
    const holder=await pickTarget(armed,"借刀杀人：选择一名装备武器且攻击范围内有其他角色的人");
    if(!holder){await finishTrick(card);return;}
    const vs=others(holder).filter(x=>inShaRange(holder,x));
    toast("借刀杀人：再选杀的目标");
    victim=await pickTarget(vs,"借刀杀人：选择被杀的目标");
    if(!victim){await finishTrick(card);return;}
    p._jiedao={holder,victim};
  }else{
    p._jiedao={holder:t1,victim:t2};
  }
  if(!p._jiedao.holder||!p._jiedao.victim){await finishTrick(card);return;}
  log(`${pName(p)}对${pName(p._jiedao.holder)}使用了【借刀杀人】，令其杀${pName(p._jiedao.victim)}`);
  const {holder:hd,victim:vt}=p._jiedao;p._jiedao=null;
  if(hd.seat===HUMAN)toast(`${pName(p)}对你使用【借刀杀人】，要求你杀${pName(vt)}！`);
  await wait(400);
  const r=await requestResponse(hd,"sha",{desc:`【借刀杀人】：是否对${pName(vt)}使用【杀】？`,by:p,jiedao:vt});
  if(r&&r.c){
    const c=r.c;
    if(c._virtual){castSha(hd,[vt],null,{name:"杀",base:def_find(hd,c),suit:c.suit});}
    else if(c.sub==="sha")await castSha(hd,[vt],c);
  }else{
    const w=hd.eq.weapon;
    if(w){removeEquip(hd,"weapon",p);log(`${pName(hd)}未出【杀】，将【${w.name}】交给${pName(p)}`);}
  }
  await finishTrick(card);
}

async function postDamageSkills(tgt,src,card,opts){
  if(!tgt.alive||!src)return;
  if(hasSkill(tgt,"奸雄")&&card&&!card._virtual){
    const use=tgt.isAI?Math.random()<0.8:await confirmModal(`<h3>奸雄</h3><div class="mbody">是否获得对你造成伤害的【${card.name}】？</div>`);
    if(use){
      const i=G.discard.findIndex(x=>card.id===x.id);
      if(i>=0){G.discard.splice(i,1);card._out=false;tgt.hand.push(card);log(`${pName(tgt)}发动【奸雄】，获得【${card.name}】`,"good");renderAll();}
    }
  }
  if(hasSkill(tgt,"反馈")&&src.alive&&hasAnyCard(src)){
    const use=tgt.isAI?Math.random()<0.85:await confirmModal(`<h3>反馈</h3><div class="mbody">是否获得${pName(src)}的一张牌？</div>`);
    if(use){
      const pick=tgt.isAI?aiPickZone(tgt,src,"shun"):null;
      if(pick&&pick.type==="eq"&&src.eq[pick.slot]){const c=removeEquip(src,pick.slot,tgt);if(c)log(`${pName(tgt)}发动【反馈】，获得${pName(src)}的【${c.name}】`,"good");}
      else if(src.hand.length){const c=src.hand.splice(rnd(src.hand.length),1)[0];tgt.hand.push(c);log(`${pName(tgt)}发动【反馈】，获得${pName(src)}的一张手牌`,"good");}
      renderAll();
    }
  }
  if(hasSkill(tgt,"刚烈")&&src.alive){
    const use=tgt.isAI?Math.random()<0.85:await confirmModal(`<h3>刚烈</h3><div class="mbody">是否对${pName(src)}发动【刚烈】判定？</div>`);
    if(use){
      const j=await doJudge(tgt,"刚烈",{type:"ganglie"});
      if(j.suit!=="H"){
        log(`【刚烈】判定生效！`);
        if(src.hand.length>=2&&Math.random()<0.5){
          for(let i=0;i<2;i++){const c=src.hand.splice(rnd(src.hand.length),1)[0];toDiscard(c);}
          log(`${pName(src)}弃置两张手牌响应【刚烈】`);
        }else{
          log(`${pName(src)}受【刚烈】1点伤害`,"hit");
          await wait(400);await damage(src,1,tgt,null);
        }
      }else log(`【刚烈】判定为红桃，未生效`);
      if(!G.discard.find(x=>x.id===j.id)&&!tgt.hand.find(x=>x.id===j.id))toDiscard(j);
    }
  }
  if(hasSkill(tgt,"遗计")){
    const use=tgt.isAI?true:await confirmModal(`<h3>遗计</h3><div class="mbody">是否发动【遗计】摸两张牌？</div>`);
    if(use){
      log(`${pName(tgt)}发动【遗计】，摸两张牌`,"good");
      await drawCards(tgt,2,{silent:true});
      if(others(tgt).length&&(tgt.isAI?Math.random()<0.6:true)){
        const give=await chooseCardsModal({title:"遗计：交给其他角色（可选0张）",cards:tgt.hand,min:0,max:2,ok:"确 定",cancel:null});
        if(give&&give.length){
          let t2;
          if(tgt.isAI)t2=aiChooseTarget(tgt,others(tgt).filter(x=>aiRel(tgt,x)==="friend"))||others(tgt)[0];
          else{toast("遗计：选择收牌人");t2=await pickTarget(others(tgt),"遗计：选择一名角色收牌");}
          if(t2){for(const c of give){loseHand(tgt,c);t2.hand.push(c);}log(`${pName(tgt)}将${give.length}张牌交给${pName(t2)}`);}
        }
      }
      renderAll();
    }
  }
}
/*================ AI 思考与身份关系 ================*/
async function think(p){
  if(!p.isAI||CFG.thinkSec<=0)return;
  p.thinking=true;renderSeats();
  await wait(CFG.thinkSec*1000);
  p.thinking=false;renderSeats();
}
function aiRel(a,b){
  if(a.identity==="nei")return b.identity==="lord"?"neutral":"enemy";
  const sameSide=(x,y)=>(x==="lord"||x==="zhong")&&(y==="lord"||y==="zhong");
  if(sameSide(a.identity,b.identity))return"friend";
  if(a.identity==="zei"&&b.identity==="zei")return"friend";
  return"enemy";
}
function aiPickGeneral(cands){
  const lv=CFG.aiLevel;
  const scored=cands.map(id=>{const g=GEN_BY_ID[id];return {id,s:g.hp*2+g.skills.length*2+(5-g.diff)+(lv>=4?g.skills.length:0)};});
  scored.sort((a,b)=>b.s-a.s);
  return lv<=1?cands[rnd(cands.length)]:scored[0].id;
}
function aiPickFrom(opts){return opts[rnd(opts.length)];}
function aiTargetScore(p,t){
  let s=0;
  if(aiRel(p,t)==="enemy")s+=40;else if(aiRel(p,t)==="neutral")s+=10;
  s+=(t.maxHp-t.hp)*8;
  if(t.identity==="lord"&&p.identity==="nei")s-=25;
  if(t.eq.weapon)s+=8;if(t.eq.armor)s+=6;
  s+=t.hand.length;
  return s;
}
function aiChooseTarget(p,legal){
  if(!legal||!legal.length)return null;
  const sorted=[...legal].sort((a,b)=>aiTargetScore(p,b)-aiTargetScore(p,a));
  return CFG.aiLevel<=1?legal[rnd(legal.length)]:sorted[0];
}
function aiEnemies(p){return others(p).filter(x=>aiRel(p,x)==="enemy");}
function aiFriends(p){return others(p).filter(x=>aiRel(p,x)==="friend");}
function cardVal(c,p){
  if(c.sub==="tao")return p.hp<p.maxHp?95:40;
  if(c.sub==="shan")return 70;
  if(c.sub==="sha")return 55;
  if(c.sub==="jiu")return 45;
  if(c.name==="无懈可击")return 65;
  if(c.sub==="weapon")return p.eq.weapon?20:60;
  if(c.sub==="armor")return p.eq.armor?15:55;
  if(c.sub==="mountU"||c.sub==="mountD")return p.eq[c.sub==="mountU"?"up":"down"]?10:35;
  return 30;
}
function aiRespond(p,need,ctx,opts){
  const lv=CFG.aiLevel;
  if(!opts.length)return null;
  const real=opts.filter(c=>!c._virtual);
  const pool=real.length?real:opts;
  if(need==="shan"){
    const threat=ctx.card?1:0.5;
    const prob=[0.3,0.55,0.8,0.95,1][lv-1]*threat+0.1;
    if(Math.random()>prob)return null;
  }else if(need==="sha"&&ctx.duel){
    const prob=[0.3,0.6,0.85,0.95,1][lv-1];
    if(Math.random()>prob)return null;
  }else if(need==="sha"&&ctx.jiedao){
    const t=ctx.jiedao;
    if(aiRel(p,t)!=="enemy"&&Math.random()<0.6)return null;
  }
  let pick=pool.sort((a,b)=>cardVal(a,p)-cardVal(b,p))[0];
  return {c:pick};
}
function aiSave(p,tgt,saveOpts){
  if(!saveOpts.length)return null;
  const rel=tgt===p?"self":aiRel(p,tgt);
  if(rel==="self")return {c:saveOpts[0]};
  if(rel==="friend")return tgt.hp<=1?{c:saveOpts[0]}:null;
  if(rel==="neutral"&&tgt.identity==="lord"&&p.identity==="zhong")return {c:saveOpts[0]};
  return null;
}
function aiWuxie(p,cardName,targets,src,cur){
  const lv=CFG.aiLevel;
  if(lv<=1)return Math.random()<0.15;
  if(targets.length===0){ // AOE
    const foeHit=targets===null?true:aiEnemies(p).length>aiFriends(p).length;
    if(cardName==="南蛮入侵"||cardName==="万箭齐发")return false;
    if(cardName==="桃园结义")return aiEnemies(p).some(e=>e.hp<e.maxHp)&&!aiFriends(p).some(f=>f.hp<f.maxHp);
    return false;
  }
  const t=targets[0];
  const rel=aiRel(p,t);
  if(t===p)return true;
  if(rel==="friend")return Math.random()<[0.2,0.5,0.8,0.95,1][lv-1];
  if(rel==="neutral")return false;
  return false;
}
function aiGuicai(sima,c,ctx,target){
  const rel=target?aiRel(sima,target):"neutral";
  if(ctx&&ctx.type==="lebu"){
    if(rel==="friend"||target===sima){if(c.suit!=="H"){const red=sima.hand.find(x=>SUIT_RED[x.suit]);if(red)return red;}}
    else if(rel==="enemy"&&c.suit==="H"){const blk=sima.hand.find(x=>!SUIT_RED[x.suit]);if(blk)return blk;}
  }
  if(ctx&&ctx.type==="shandian"){
    const bad=c.suit==="S"&&c.rank>=2&&c.rank<=9;
    if((rel==="friend"||target===sima)&&bad){const safe=sima.hand.find(x=>!(x.suit==="S"&&x.rank>=2&&x.rank<=9));if(safe)return safe;}
    if(rel==="enemy"&&!bad){const bad2=sima.hand.find(x=>x.suit==="S"&&x.rank>=2&&x.rank<=9);if(bad2)return bad2;}
  }
  return null;
}
function aiLuoyi(p){
  const hasSha=p.hand.some(c=>c.sub==="sha")||hasSkill(p,"武圣");
  return CFG.aiLevel>=2&&hasSha&&p.hp>=2&&aiEnemies(p).length>0;
}
function aiDiscard(p,need,force){
  const sorted=[...p.hand].sort((a,b)=>cardVal(a,p)-cardVal(b,p));
  return sorted.slice(0,need);
}
function aiPickTargetCard(p,cands){
  const sorted=[...cands].sort((a,b)=>(b.hand.length+b.eq.weapon?1:0)-(a.hand.length));
  return CFG.aiLevel<=1?cands[rnd(cands.length)]:sorted[0]||cands[0];
}
function aiPickZone(p,tgt,mode){
  if(mode==="chai"&&tgt.judge.length&&aiRel(p,tgt)==="friend")
    return {type:"judge",id:tgt.judge[0].id};
  if(tgt.eq.armor&&aiRel(p,tgt)!=="friend")return {type:"eq",slot:"armor"};
  if(tgt.eq.weapon&&aiRel(p,tgt)!=="friend")return {type:"eq",slot:"weapon"};
  if(tgt.hand.length)return {type:"hand"};
  const s=["weapon","armor","up","down"].find(s=>tgt.eq[s]);
  return s?{type:"eq",slot:s}:null;
}
function aiPickWugu(t,avail){
  const scored=avail.map(c=>({c,s:cardVal(c,t)}));
  scored.sort((a,b)=>b.s-a.s);
  return [scored[0].c];
}
function aiLiuli(tgt,attacker,legal){
  const enemies=legal.filter(x=>aiRel(tgt,x)==="enemy"&&x!==attacker);
  const pick=enemies.length?aiChooseTarget(tgt,enemies):null;
  if(!pick)return null;
  const c=[...tgt.hand].sort((a,b)=>cardVal(a,tgt)-cardVal(b,tgt))[0];
  return {c,t:pick};
}

async function skillKurou(p){
  if(p.hp<=1)return false;
  p.hp--;log(`${pName(p)}发动【苦肉】，失去1点体力`,"hit");
  fxText($("#seat"+p.seat),"-1");renderSeats();

}
async function skillZhiheng(p){
  if(p.used.zhiheng||!p.hand.length)return false;
  const n=p.isAI?Math.max(1,Math.min(p.hand.length,2)):0;
  let disc;
  if(p.isAI)disc=aiDiscard(p,n);
  else{
    disc=await chooseCardsModal({title:"制衡",text:"弃置任意张牌，摸等量的牌",cards:p.hand,min:1,max:p.hand.length});
    if(!disc||!disc.length)return false;
  }
  p.used.zhiheng=true;
  for(const c of disc){loseHand(p,c);toDiscard(c);}
  log(`${pName(p)}发动【制衡】，弃置${disc.length}张牌`,"good");
  await drawCards(p,disc.length);
  return true;
}
async function skillRende(p){
  if(!p.hand.length)return false;
  let give;
  if(p.isAI){
    const n=Math.min(2,p.hand.length);
    give=aiDiscard(p,n);
  }else{
    give=await chooseCardsModal({title:"仁德",text:"选择要交给其他角色的手牌",cards:p.hand,min:1,max:p.hand.length});
    if(!give||!give.length)return false;
  }

  if(p.isAI)t2=aiChooseTarget(p,aiFriends(p).length?aiFriends(p):others(p));
  else{toast("仁德：选择收牌人");t2=await pickTarget(others(p),"仁德：选择一名角色获得牌");}
  if(!t2)return false;
  for(const c of give){loseHand(p,c);t2.hand.push(c);}
  p.f.rendeGiven=(p.f.rendeGiven||0)+give.length;
  log(`${pName(p)}发动【仁德】，将${give.length}张牌交给${pName(t2)}`,"good");
  if(p.f.rendeGiven>=2&&!p.f.rendeHealed&&p.hp<p.maxHp){

    log(`${pName(p)}仁德达到两张牌，回复1点体力`,"good");
    fxText($("#seat"+p.seat),"+1","fx-heal");
  }
  renderAll();
  return true;
}
