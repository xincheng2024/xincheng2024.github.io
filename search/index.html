<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邢嘟嘟搜索引擎</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            user-select: none;
        }
        body {
            background: #f8f9ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        .main-container {
            width: 92vw;
            height: 92vh;
            max-width: 1400px;
            max-height: 900px;
            background: #ffffff;
            border-radius: 42px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            padding: 24px 32px;
        }
        .gear-btn {
            position: absolute;
            top: 24px;
            right: 32px;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 26px;
            color: #1e2b6e;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.04);
            z-index: 10;
        }
        .gear-btn:hover {
            background: #d9e0ff;
            transform: rotate(30deg);
        }
        .search-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding-bottom: 40px;
        }
        .brand-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 4px;
        }
        .brand {
            font-size: 58px;
            font-weight: 700;
            color: #1e2b6e;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 6px rgba(30, 43, 110, 0.12);
        }
        .brand span {
            color: #3a5bff;
        }
        .brand-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 20px;
            background: #eef2ff;
            padding: 6px;
            box-shadow: 0 6px 16px rgba(58, 91, 255, 0.15);
        }
        .brand-img2 {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 20px;
            background: #eef2ff;
            padding: 6px;
            box-shadow: 0 6px 16px rgba(58, 91, 255, 0.15);
        }
        .subtitle {
            font-size: 20px;
            color: #5a6288;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .subtitle .fat {
            color: #ff3b3b;
            font-weight: 700;
        }
        .search-box-row {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 80%;
            max-width: 760px;
        }
        .search-input {
            flex: 1;
            height: 64px;
            border: 2px solid #cbd5ff;
            border-radius: 60px;
            padding: 0 28px;
            font-size: 20px;
            outline: none;
            background: white;
            transition: border 0.2s, box-shadow 0.2s;
            color: #1e1e2f;
        }
        .search-input:focus {
            border-color: #3a5bff;
            box-shadow: 0 0 0 6px rgba(58, 91, 255, 0.15);
        }
        .dudu-btn {
            height: 64px;
            border: none;
            border-radius: 60px;
            padding: 0 42px;
            font-size: 24px;
            font-weight: 600;
            background: #3a5bff;
            color: white;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 10px 20px -8px #3a5bff99;
            letter-spacing: 2px;
            white-space: nowrap;
        }
        .dudu-btn:hover {
            background: #2540cc;
            transform: scale(1.02);
        }
        .dudu-btn:active {
            transform: scale(0.98);
        }
        .results-area {
            width: 100%;
            max-width: 860px;
            margin-top: 20px;
            overflow-y: auto;
            flex: 1;
            padding-right: 8px;
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .results-area.show {
            display: flex;
        }
        .result-count {
            font-size: 18px;
            color: #3f4a7a;
            font-weight: 500;
            margin-bottom: 8px;
            padding-left: 8px;
        }
        .result-item {
            background: #ffffff;
            border-radius: 24px;
            padding: 18px 24px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.02);
            border: 1px solid #e9edff;
            transition: all 0.15s;
            cursor: pointer;
        }
        .result-item:hover {
            border-color: #b7c2ff;
            background: #fbfcff;
            box-shadow: 0 10px 20px -10px rgba(58, 91, 255, 0.2);
        }
        .result-title {
            font-size: 22px;
            font-weight: 600;
            color: #1e2b6e;
            margin-bottom: 6px;
            word-break: break-word;
        }
        .result-title .highlight {
            color: #ff3b3b;
        }
        .result-title .normal {
            color: #1e2b6e;
        }
        .result-snippet {
            font-size: 16px;
            color: #5a6288;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .result-snippet .highlight {
            color: #ff3b3b;
            font-weight: 500;
        }
        .result-snippet .normal {
            color: #3a5bff;
        }
        .panel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 42px;
            z-index: 100;
        }
        .panel-overlay.active {
            display: flex;
        }
        .panel-window {
            width: 80%;
            max-width: 720px;
            height: 78%;
            max-height: 650px;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: pop 0.2s ease;
        }
        @keyframes pop {
            from { transform: scale(0.96); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .panel-header {
            padding: 20px 28px;
            background: #f4f7ff;
            font-size: 26px;
            font-weight: 700;
            color: #1e2b6e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dbe2ff;
        }
        .panel-header .close-panel {
            font-size: 32px;
            cursor: pointer;
            color: #6a7ba9;
            line-height: 1;
            transition: color 0.15s;
        }
        .panel-header .close-panel:hover {
            color: #1e2b6e;
        }
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
        }
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .settings-item {
            background: #f9faff;
            border-radius: 18px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e2e8ff;
            transition: 0.1s;
        }
        .settings-item .item-name {
            font-size: 18px;
            color: #1e2b6e;
            font-weight: 500;
            word-break: break-word;
        }
        .settings-item .item-actions {
            display: flex;
            gap: 12px;
        }
        .settings-item .item-actions button {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .settings-item .edit-btn {
            color: #2b4eff;
        }
        .settings-item .edit-btn:hover {
            background: #e1e8ff;
        }
        .settings-item .delete-btn {
            color: #d12e2e;
        }
        .settings-item .delete-btn:hover {
            background: #ffe1e1;
        }
        .add-item-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 8px;
        }
        .add-item-btn {
            background: #eef2ff;
            border: 2px dashed #a3b3f0;
            border-radius: 60px;
            padding: 12px 36px;
            font-size: 18px;
            font-weight: 600;
            color: #2b4eff;
            cursor: pointer;
            transition: 0.15s;
            width: fit-content;
        }
        .add-item-btn:hover {
            background: #dfe7ff;
            border-color: #2b4eff;
        }
        .edit-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
            height: 100%;
        }
        .edit-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .edit-field label {
            font-size: 18px;
            font-weight: 600;
            color: #1e2b6e;
        }
        .edit-field input, .edit-field textarea {
            border: 2px solid #dbe2ff;
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 17px;
            outline: none;
            font-family: inherit;
            background: #fcfdff;
            transition: border 0.15s;
        }
        .edit-field input:focus, .edit-field textarea:focus {
            border-color: #2b4eff;
        }
        .edit-field textarea {
            min-height: 200px;
            resize: vertical;
            flex: 1;
        }
        .edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: auto;
            padding-top: 16px;
        }
        .edit-actions button {
            padding: 12px 32px;
            border-radius: 40px;
            border: none;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .save-edit-btn {
            background: #2b4eff;
            color: white;
            box-shadow: 0 8px 16px -6px #2b4eff;
        }
        .save-edit-btn:hover {
            background: #1a3ad0;
        }
        .cancel-edit-btn {
            background: #eef2ff;
            color: #1e2b6e;
        }
        .cancel-edit-btn:hover {
            background: #dfe7ff;
        }
        .content-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            max-width: 700px;
            height: 70%;
            max-height: 550px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 40px 70px -20px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 200;
            border: 1px solid #d0d9ff;
        }
        .content-popup.active {
            display: flex;
        }
        .popup-header {
            padding: 20px 28px;
            background: #f4f7ff;
            font-size: 28px;
            font-weight: 700;
            color: #1e2b6e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #dbe2ff;
        }
        .popup-header .close-popup {
            font-size: 34px;
            cursor: pointer;
            color: #6a7ba9;
            transition: 0.1s;
            line-height: 1;
        }
        .popup-header .close-popup:hover {
            color: #1e2b6e;
        }
        .popup-content {
            padding: 28px;
            overflow-y: auto;
            font-size: 18px;
            line-height: 1.7;
            color: #2d3152;
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #eef2ff;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b7c2ff;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8e9eff;
        }
        .main-container.searching .search-area {
            justify-content: flex-start;
            padding-top: 20px;
            padding-bottom: 20px;
            flex: 0 0 auto;
        }
        .main-container.searching .brand-row .brand {
            font-size: 36px;
        }
        .main-container.searching .brand-img {
            width: 50px;
            height: 50px;
        }
        .main-container.searching .brand-img2 {
            width: 50px;
            height: 50px;
        }
        .main-container.searching .subtitle {
            font-size: 14px;
            margin-bottom: 4px;
        }
        .main-container.searching .search-box-row {
            width: 100%;
            max-width: 860px;
        }
        .main-container.searching .search-input {
            height: 54px;
            font-size: 18px;
        }
        .main-container.searching .dudu-btn {
            height: 54px;
            font-size: 20px;
            padding: 0 32px;
        }
        .main-container.searching .results-area {
            display: flex;
        }
        .footer-bottom {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 15px;
            color: #8a92b9;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="main-container" id="mainContainer">
        <div class="gear-btn" id="gearBtn">⚙️</div>

        <div class="search-area" id="searchArea">
            <div class="brand-row">
                <div class="brand">邢嘟嘟<span>搜索引擎</span></div>
                <img class="brand-img" src="https://cdn.luogu.com.cn/upload/image_hosting/ahhxnvle.webp" alt="嘟嘟" onerror="this.style.display='none'">
                <img class="brand-img2" src="https://cdn.luogu.com.cn/upload/image_hosting/ts7e9g7j.webp" alt="嘟嘟2" onerror="this.style.display='none'">
            </div>
            <div class="subtitle">你的胆子真是<span class="fat">肥嘟嘟</span>的</div>
            <div class="search-box-row">
                <input type="text" class="search-input" id="searchInput" placeholder="输入关键词...">
                <button class="dudu-btn" id="duduBtn">嘟嘟一下</button>
            </div>
        </div>

        <div class="results-area" id="resultsArea">
            <div class="result-count" id="resultCount"></div>
            <div id="resultsList"></div>
        </div>

        <div class="panel-overlay" id="settingsOverlay">
            <div class="panel-window">
                <div class="panel-header">
                    整蛊
                    <span class="close-panel" id="closeSettings">✕</span>
                </div>
                <div class="panel-content" id="settingsContent">
                    <div class="settings-list" id="settingsList"></div>
                    <div class="add-item-wrapper">
                        <button class="add-item-btn" id="addItemBtn">➕ 添加项目</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel-overlay" id="editOverlay">
            <div class="panel-window">
                <div class="panel-header">
                    编辑
                    <span class="close-panel" id="closeEdit">✕</span>
                </div>
                <div class="panel-content">
                    <div class="edit-form">
                        <div class="edit-field">
                            <label>网页名字</label>
                            <input type="text" id="editName" placeholder="例如: 百度">
                        </div>
                        <div class="edit-field">
                            <label>内容</label>
                            <textarea id="editContent" placeholder="输入网页内容..."></textarea>
                        </div>
                        <div class="edit-actions">
                            <button class="cancel-edit-btn" id="cancelEdit">取消</button>
                            <button class="save-edit-btn" id="saveEdit">保存</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-popup" id="contentPopup">
            <div class="popup-header">
                <span id="popupTitle"></span>
                <span class="close-popup" id="closePopup">✕</span>
            </div>
            <div class="popup-content" id="popupContent"></div>
        </div>

        <div class="footer-bottom">厦门二中学生搜索引擎</div>
    </div>

    <script>
        (function() {
            let pages = [];
            let nextId = 1;

            const mainContainer = document.getElementById('mainContainer');
            const gearBtn = document.getElementById('gearBtn');
            const searchInput = document.getElementById('searchInput');
            const duduBtn = document.getElementById('duduBtn');
            const resultsArea = document.getElementById('resultsArea');
            const resultCount = document.getElementById('resultCount');
            const resultsList = document.getElementById('resultsList');

            const settingsOverlay = document.getElementById('settingsOverlay');
            const closeSettings = document.getElementById('closeSettings');
            const settingsList = document.getElementById('settingsList');
            const addItemBtn = document.getElementById('addItemBtn');

            const editOverlay = document.getElementById('editOverlay');
            const closeEdit = document.getElementById('closeEdit');
            const editName = document.getElementById('editName');
            const editContent = document.getElementById('editContent');
            const saveEdit = document.getElementById('saveEdit');
            const cancelEdit = document.getElementById('cancelEdit');

            const contentPopup = document.getElementById('contentPopup');
            const popupTitle = document.getElementById('popupTitle');
            const popupContent = document.getElementById('popupContent');
            const closePopup = document.getElementById('closePopup');

            let editingId = null;

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function highlightText(text, keyword) {
                if (!keyword) return escapeHtml(text);
                const escapedText = escapeHtml(text);
                const escapedKeyword = escapeHtml(keyword);
                const regex = new RegExp(`(${escapedKeyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                return escapedText.replace(regex, '<span class="highlight">$1</span>');
            }

            function highlightSnippet(text, keyword) {
                if (!keyword) return escapeHtml(text);
                const escaped = escapeHtml(text);
                const kw = escapeHtml(keyword);
                const regex = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                return escaped.replace(regex, '<span class="highlight">$1</span>');
            }

            function renderSettings() {
                settingsList.innerHTML = '';
                if (pages.length > 0) {
                    pages.forEach(page => {
                        const item = document.createElement('div');
                        item.className = 'settings-item';
                        item.innerHTML = `
                            <span class="item-name">${escapeHtml(page.name)}</span>
                            <div class="item-actions">
                                <button class="edit-btn" data-id="${page.id}" title="编辑">✏️</button>
                                <button class="delete-btn" data-id="${page.id}" title="删除">🗑️</button>
                            </div>
                        `;
                        settingsList.appendChild(item);
                    });
                }
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = parseInt(btn.dataset.id);
                        openEdit(id);
                    });
                });
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = parseInt(btn.dataset.id);
                        deletePage(id);
                    });
                });
            }

            function openSettings() {
                renderSettings();
                settingsOverlay.classList.add('active');
            }

            function closeSettingsPanel() {
                settingsOverlay.classList.remove('active');
            }

            function openEdit(id = null) {
                if (id !== null) {
                    const page = pages.find(p => p.id === id);
                    if (!page) return;
                    editingId = id;
                    editName.value = page.name;
                    editContent.value = page.content;
                } else {
                    editingId = null;
                    editName.value = '新建项目';
                    editContent.value = '';
                }
                editOverlay.classList.add('active');
            }

            function saveEditHandler() {
                const name = editName.value.trim() || '未命名';
                const content = editContent.value;
                if (editingId !== null) {
                    const page = pages.find(p => p.id === editingId);
                    if (page) {
                        page.name = name;
                        page.content = content;
                    }
                } else {
                    pages.push({
                        id: nextId++,
                        name: name,
                        content: content
                    });
                }
                closeEditPanel();
                renderSettings();
            }

            function closeEditPanel() {
                editOverlay.classList.remove('active');
                editingId = null;
            }

            function deletePage(id) {
                pages = pages.filter(p => p.id !== id);
                renderSettings();
            }

            function performSearch() {
                const keyword = searchInput.value.trim();
                mainContainer.classList.add('searching');

                if (!keyword) {
                    resultsList.innerHTML = '';
                    resultCount.textContent = '搜索到了 0 个结果';
                    return;
                }

                const lowerKeyword = keyword.toLowerCase();
                const matched = pages.filter(page => 
                    page.name.toLowerCase().includes(lowerKeyword)
                );

                const count = matched.length;
                resultCount.textContent = `搜索到了 ${count} 个结果`;

                resultsList.innerHTML = '';
                matched.forEach(page => {
                    const item = document.createElement('div');
                    item.className = 'result-item';

                    const titleHtml = highlightText(page.name, keyword);
                    const lines = page.content.split('\n');
                    const snippetText = lines.slice(0, 2).join('\n');
                    const snippetHtml = highlightSnippet(snippetText, keyword);

                    item.innerHTML = `
                        <div class="result-title">${titleHtml}</div>
                        <div class="result-snippet">${snippetHtml}</div>
                    `;

                    item.addEventListener('click', () => {
                        openContentPopup(page);
                    });

                    resultsList.appendChild(item);
                });
            }

            function openContentPopup(page) {
                popupTitle.textContent = page.name;
                popupContent.textContent = page.content;
                contentPopup.classList.add('active');
            }

            function closeContentPopup() {
                contentPopup.classList.remove('active');
            }

            gearBtn.addEventListener('click', openSettings);
            closeSettings.addEventListener('click', closeSettingsPanel);
            settingsOverlay.addEventListener('click', (e) => {
                if (e.target === settingsOverlay) closeSettingsPanel();
            });
            editOverlay.addEventListener('click', (e) => {
                if (e.target === editOverlay) closeEditPanel();
            });
            addItemBtn.addEventListener('click', () => openEdit(null));
            saveEdit.addEventListener('click', saveEditHandler);
            cancelEdit.addEventListener('click', closeEditPanel);
            closeEdit.addEventListener('click', closeEditPanel);
            duduBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });
            closePopup.addEventListener('click', closeContentPopup);

            renderSettings();
        })();
    </script>
</body>
</html>
